[package]
name = "cumulus-jam-zombienet-tests"
version = "0.1.0"
description = "Reusable JAM zombienet helpers for the Cumulus JAM collator."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
array-bytes = { workspace = true }
codec = { workspace = true, default-features = true }
# The proxy decodes every submitted PoV to name the parachain blocks it carries.
cumulus-primitives-core = { workspace = true, default-features = true }
env_logger = { workspace = true }
log = { workspace = true }
rand = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true, features = ["raw_value"] }
tokio = { workspace = true, features = [
	"macros",
	"process",
	"rt-multi-thread",
	"signal",
	"sync",
	"time",
] }
jsonrpsee = { workspace = true, features = ["ws-client"] }
# The proxy speaks polkajam's jsonrpsee 0.26 surface; the harness keeps 0.24 for `JamRpc`.
jsonrpsee-jam = { workspace = true, features = ["server", "ws-client"] }
sp-core = { workspace = true, default-features = true }
sp-keyring = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }
tempfile = { workspace = true }
# `network::collator_args` returns the SDK's own `Arg`, so `spawn` can pass it straight to the
# `NetworkConfigBuilder` it builds. Same 0.5.0 the rest of the workspace uses.
zombienet-sdk = { workspace = true }
# The `ParaConfig` the spawned collators' subxt clients are typed with.
cumulus-zombienet-sdk-helpers = { workspace = true }
# The authorizer hash written into genesis has to be the one the collator derives, so it is built
# out of the very crates the collator and the guest use — the same deps polkadot-omni-node-lib
# names. `parachain-service-core` is the consolidated types/keys/authorizer crate the former
# `cumulus` facade re-exported from.
parachain-service-core = { workspace = true, default-features = true, features = ["std"] }
parachain-authorizer = { workspace = true, default-features = true, features = ["std"] }
# The genesis `gen-spec` compiles is built by `parachain-chain-spec` (uncommitted sibling-repo
# work), so the storage layout and authorizer hashes cannot drift from what the service decodes.
parachain-chain-spec = { workspace = true, default-features = true }
jam-std-common = { workspace = true }
# The hash an unassigned core's queue holds at genesis.
jam-null-authorizer-bin = { workspace = true, default-features = true }
# The byte strings the JAM RPC carries are base64, and this is where that spelling is defined.
jam-types = { workspace = true, default-features = true, features = [
	"bytes",
	"serde",
	"std",
] }
