[package]
name = "cumulus-zombienet-sdk-tests"
version = "0.1.0"
description = "Zomebienet-sdk tests for cumulus."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
polkadot-primitives = { workspace = true, default-features = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
futures = { workspace = true }
sp-rpc = { workspace = true, default-features = true }
sp-statement-store = { workspace = true, default-features = true, features = ["serde"] }
sc-network-statement = { workspace = true, default-features = true }
sc-statement-store = { workspace = true, default-features = true, features = ["test-helpers"] }
sp-keyring = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-crypto-hashing = { workspace = true, default-features = true }
sp-version = { workspace = true, default-features = true }
sp-maybe-compressed-blob = { workspace = true, default-features = true }
parity-wasm = { workspace = true }
sc-executor = { workspace = true, default-features = true }
sc-executor-common = { workspace = true, default-features = true }
frame-support = { workspace = true }
cumulus-primitives-core = { workspace = true }
sp-runtime = { workspace = true, default-features = true }
sp-transaction-storage-proof = { workspace = true, default-features = true }
verifiable = { workspace = true, default-features = true }
sp-consensus-aura = { workspace = true, default-features = true }
sp-consensus-slots = { workspace = true, default-features = true }
codec = { workspace = true }
scale-info = { workspace = true, features = ["derive"] }
rstest = { workspace = true }
subxt = { workspace = true, features = ["native"] }
subxt-signer = { workspace = true, features = ["sr25519"] }

cid = { workspace = true }
hex = { workspace = true, default-features = true }
multihash = { workspace = true, default-features = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

# 0.5.0 carries JAM support upstream (PR #573), so relay and JAM share one source.
zombienet-sdk = { workspace = true }
zombienet-orchestrator = { workspace = true }
zombienet-configuration = { workspace = true }
cumulus-zombienet-sdk-helpers = { workspace = true }
cumulus-test-runtime = { workspace = true }

# JAM genesis/authorizer computation. Optional so the relay path never builds it.
cumulus-jam-zombienet-tests = { path = "../jam-tests", optional = true }
# The accumulated para head the JAM path asserts on is the service's `ParaInfo`; decoding it with
# the service's own types keeps the wire layout in one place. Optional so the relay path never
# builds it.
parachain-service-core = { path = "../../../../parachain-service/core", features = [
	"std",
], optional = true }

[features]
zombie-ci = []
generate-snapshots = []
# Root the network in a JAM chain. A feature, not `RUSTFLAGS="--cfg jam"`, so the JAM paths
# are type-checked by `cargo check --features jam` without a whole-workspace rebuild.
jam = [
	"dep:cumulus-jam-zombienet-tests",
	"dep:parachain-service-core",
	"cumulus-zombienet-sdk-helpers/jam",
]
