[package]
name = "cumulus-jam-rpc-interface"
description = "Implementation of the cumulus-jam-interface traits over a websocket to a JAM node"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license = "Apache-2.0"
# Not publishable while `jam-types`/`jam-std-common` are git dependencies.
publish = false

[lints]
workspace = true

[dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
cumulus-jam-interface = { workspace = true }
futures = { workspace = true }
jam-std-common = { workspace = true }
jam-types = { workspace = true, features = ["std"] }
jsonrpsee-jam = { workspace = true, features = ["ws-client"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
