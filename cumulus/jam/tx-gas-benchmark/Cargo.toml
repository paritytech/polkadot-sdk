[package]
name = "cumulus-jam-tx-gas-benchmark"
description = "Offline benchmark of the refine gas parachain transactions cost on JAM"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
clap = { features = ["derive"], workspace = true }
codec = { workspace = true, default-features = true }
futures = { workspace = true }
jam-codec = { workspace = true, features = ["std"] }
jam-types = { workspace = true, features = ["std"] }
rand_chacha = { workspace = true, default-features = true }
schnorrkel = { workspace = true, default-features = true }

# The refine node runs the parachain runtime under polkavm 0.36, the workspace pins 0.35. The gas
# model differs between the two, so the refine run uses the node's version.
polkavm = { version = "0.36.0" }

parachain-authorizer = { workspace = true, default-features = true, features = ["std"] }
parachain-service-core = { workspace = true, default-features = true, features = ["std"] }

cumulus-client-parachain-inherent = { workspace = true, default-features = true }
cumulus-client-service = { workspace = true, default-features = true }
cumulus-jam-state-reader = { workspace = true, default-features = true }
cumulus-pallet-weight-reclaim = { workspace = true, default-features = true }
cumulus-primitives-core = { workspace = true, default-features = true }
cumulus-primitives-parachain-inherent = { workspace = true, default-features = true }
frame-metadata-hash-extension = { workspace = true, default-features = true }
frame-system = { workspace = true, default-features = true }
pallet-balances = { workspace = true, default-features = true }
pallet-transaction-payment = { workspace = true, default-features = true }
parachain-template-runtime = { workspace = true, default-features = true }
sc-block-builder = { workspace = true, default-features = true }
sc-chain-spec = { workspace = true, default-features = true }
sc-client-api = { workspace = true, default-features = true }
sc-consensus = { workspace = true, default-features = true }
sc-executor = { workspace = true, default-features = true }
sc-executor-polkavm = { workspace = true, default-features = true }
sc-service = { workspace = true, default-features = false }
sp-additional-data = { workspace = true, default-features = true }
sp-api = { workspace = true, default-features = true }
sp-blockchain = { workspace = true, default-features = true }
sp-consensus = { workspace = true, default-features = true }
sp-consensus-aura = { workspace = true, default-features = true }
sp-consensus-babe = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-externalities = { workspace = true, default-features = true }
sp-genesis-builder = { workspace = true, default-features = true }
sp-inherents = { workspace = true, default-features = true }
sp-keyring = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }
sp-statement-store = { workspace = true, default-features = true }
sp-timestamp = { workspace = true, default-features = true }
sp-trie = { workspace = true, default-features = true }
