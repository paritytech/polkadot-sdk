[package]
name = "cumulus-jam-state-reader"
description = "JAM chain-state read side of the additional-data channel: the `jam_state_read` host function, `JamStateReader`, and `JamProofReader`."
version = "0.1.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license = "Apache-2.0"
# Not publishable while `jam-types`/`jam-std-common` are git dependencies.
publish = false

[lints]
workspace = true

[dependencies]
sp-additional-data = { workspace = true }
sp-externalities = { workspace = true }
sp-runtime-interface = { workspace = true }

# JAM state-proof reading (`jam_proof.rs`). Only JAM runtimes (`--cfg jam`) and the host node
# read JAM state; relay runtimes, WASM or PolkaVM, read relay state. `parachain-service-core`
# has its `no_std` gate hard-coded to riscv
# (`#![cfg_attr(any(target_arch = "riscv32", target_arch = "riscv64"), no_std)]`), so it cannot
# compile for `wasm32v1-none` (no `std` there), and on riscv it switches off sp-io's allocator
# and panic handler, which a relay PolkaVM runtime needs. `parachain-system` target-gates the
# same dependency for the same reason.
[target.'cfg(any(jam, not(substrate_runtime)))'.dependencies]
codec = { workspace = true }
# no_std by default (`default = []`): the riscv build of this crate needs the verifier no_std,
# while the std feature gates its std side. Wired the same way omni-node-lib pulls it, except
# feature-driven instead of hard-coded to std.
parachain-service-core = { workspace = true }

[target.'cfg(jam)'.dependencies]
# The JAM (PolkaVM) side declares its host calls at fixed indices.
sp-jam-runtime-interface = { workspace = true }

[dev-dependencies]
# Tests run only on the host (std); enabling sp-state-machine/std keeps its own
# std-gated impls compiled so the dep builds 0-warning.
sp-state-machine = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"parachain-service-core/std",
	"sp-additional-data/std",
	"sp-externalities/std",
	"sp-runtime-interface/std",
]