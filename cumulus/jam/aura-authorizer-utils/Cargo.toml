[package]
name = "cumulus-aura-authorizer-utils"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "Apache-2.0"
publish = true
description = "AURA authorization types, signing payloads, and collator proofs for JAM parachains"
homepage.workspace = true

[lints]
workspace = true

[dependencies]
blake2b_simd = { workspace = true }
binary-merkle-tree = { workspace = true }
hash-db = { workspace = true }
hash256-std-hasher = { workspace = true }
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
jam-codec = { workspace = true, features = ["derive"] }
jam-types = { workspace = true }
polkadot-parachain-primitives = { workspace = true }
primitive-types = { workspace = true, features = ["codec"] }
sp-crypto-hashing = { workspace = true }

[features]
default = []
std = [
    "blake2b_simd/std",
    "binary-merkle-tree/std",
    "hash-db/std",
    "hash256-std-hasher/std",
    "codec/std",
    "jam-codec/std",
    "jam-types/std",
    "polkadot-parachain-primitives/std",
    "primitive-types/std",
    "sp-crypto-hashing/std",
]
