[package]
name = "cumulus-aura-authorizer-utils"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "Apache-2.0"
publish = true
description = "AURA authorization types, signing payloads, and collator proofs for JAM parachains"
homepage.workspace = true

[lints]
workspace = true

[dependencies]
binary-merkle-tree = { workspace = true }
blake2b_simd = { workspace = true }
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
hash-db = { workspace = true }
hash256-std-hasher = { workspace = true }
jam-codec = { workspace = true, features = ["derive"] }
jam-types = { workspace = true }
polkadot-parachain-primitives = { workspace = true }
primitive-types = { workspace = true, features = ["codec"] }
sp-crypto-hashing = { workspace = true }
sp-keystore = { workspace = true, optional = true }

[target.'cfg(target_env = "polkavm")'.dependencies]
# The JAM guest provides these lang items instead of the Substrate runtime.
sp-io = { workspace = true, features = ["disable_allocator", "disable_panic_handler"] }

[dev-dependencies]
ed25519-dalek = { workspace = true }
jam-program-blob-common = "=0.1.29"
# Match the interpreter ABI used by jam-program-blob-common.
polkavm = "0.37.0"
schnorrkel = { workspace = true, features = ["std"] }

[features]
default = []
std = [
	"binary-merkle-tree/std",
	"blake2b_simd/std",
	"codec/std",
	"hash-db/std",
	"hash256-std-hasher/std",
	"jam-codec/std",
	"jam-types/std",
	"polkadot-parachain-primitives/std",
	"primitive-types/std",
	"sp-crypto-hashing/std",
	"sp-keystore/std",
]
