[package]
name = "polkadot-bulletin-parachain"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
build = "build.rs"
description = "PoC custom parachain node for the Polkadot Bulletin Chain, composed from polkadot-omni-node-lib with HOP wired in"
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
clap = { features = ["derive"], workspace = true }
color-eyre = { workspace = true }
jsonrpsee = { features = ["server"], workspace = true }
log = { workspace = true, default-features = true }

# Local
polkadot-jemalloc-shim = { workspace = true }
polkadot-omni-node-lib = { workspace = true, features = ["rococo-native", "westend-native"] }
sc-cli = { workspace = true, default-features = false }
sc-hop = { workspace = true, default-features = true }
sc-service = { workspace = true, default-features = false }
sc-transaction-pool = { workspace = true, default-features = true }
sp-api = { workspace = true, default-features = true }
sp-blockchain = { workspace = true, default-features = true }
sp-hop = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }

[target.'cfg(target_os = "linux")'.dependencies]
polkadot-jemalloc-shim = { workspace = true, features = ["jemalloc-allocator"] }

[dev-dependencies]
assert_cmd = { workspace = true }

[build-dependencies]
substrate-build-script-utils = { workspace = true, default-features = true }

[features]
default = []
jemalloc-allocator = ["polkadot-jemalloc-shim/jemalloc-allocator"]
runtime-benchmarks = [
	"polkadot-omni-node-lib/runtime-benchmarks",
]
try-runtime = [
	"polkadot-omni-node-lib/try-runtime",
]
