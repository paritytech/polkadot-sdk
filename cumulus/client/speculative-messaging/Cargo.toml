[package]
name = "cumulus-client-speculative-messaging"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "Client-side support for speculative cross-chain messaging between collators via relay chain peers"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
codec = { features = ["derive"], workspace = true, default-features = true }
futures = { workspace = true }
parking_lot = { workspace = true, default-features = true }
thiserror = { workspace = true }
tracing = { workspace = true, default-features = true }

# Polkadot
polkadot-parachain-primitives = { workspace = true, default-features = true }
polkadot-primitives-speculative-messaging = { workspace = true, default-features = true }

# Substrate
sp-core = { workspace = true, default-features = true }

[dev-dependencies]
tokio = { features = ["macros", "rt-multi-thread"], workspace = true, default-features = true }
