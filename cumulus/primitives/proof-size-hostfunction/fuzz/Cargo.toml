[package]
name = "cumulus-proof-size-hostfunction-fuzz"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Fuzzer for the storage-root PoV size estimation of the proof size host function."
publish = false

[lints]
workspace = true

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "pov_estimation"
path = "fuzz_targets/pov_estimation.rs"
test = false
doc = false

[dependencies]
arbitrary = { features = ["derive"], workspace = true }
cumulus-primitives-proof-size-hostfunction = { workspace = true, default-features = true }
libfuzzer-sys = { workspace = true }
log = { workspace = true }
sp-core = { workspace = true, default-features = true }
sp-externalities = { workspace = true, default-features = true }
sp-io = { workspace = true, default-features = true }
sp-state-machine = { workspace = true, default-features = true }
sp-tracing = { workspace = true, default-features = true }
sp-trie = { workspace = true, default-features = true }
