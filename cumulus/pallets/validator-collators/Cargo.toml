[package]
authors.workspace = true
description = "Pallet that selects the relay-chain validators with registered keys as collators."
edition.workspace = true
homepage.workspace = true
license = "Apache-2.0"
name = "pallet-validator-collators"
repository.workspace = true
version = "0.2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
log = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
cumulus-pallet-parachain-system.workspace = true
cumulus-primitives-core.workspace = true
frame-support.workspace = true
frame-system.workspace = true
pallet-authorship.workspace = true
pallet-session.workspace = true
sp-runtime.workspace = true
sp-staking.workspace = true
frame-benchmarking = { optional = true, workspace = true }
sp-trie = { optional = true, workspace = true }

[dev-dependencies]
pallet-balances = { default-features = true, path = "../../../substrate/frame/balances" }
pallet-collator-selection = { default-features = true, path = "../collator-selection" }
sp-io = { default-features = true, path = "../../../substrate/primitives/io" }
sp-runtime = { default-features = true, path = "../../../substrate/primitives/runtime" }
sp-tracing = { default-features = true, path = "../../../substrate/primitives/tracing" }
sp-trie = { default-features = true, path = "../../../substrate/primitives/trie" }

[features]
default = ["std"]
runtime-benchmarks = [
	"cumulus-pallet-parachain-system/runtime-benchmarks",
	"cumulus-primitives-core/runtime-benchmarks",
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-session/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"sp-staking/runtime-benchmarks",
	"sp-trie",
]
std = [
	"codec/std",
	"cumulus-pallet-parachain-system/std",
	"cumulus-primitives-core/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"pallet-authorship/std",
	"pallet-session/std",
	"rand/std",
	"rand_chacha/std",
	"scale-info/std",
	"sp-runtime/std",
	"sp-staking/std",
	"sp-trie?/std",
]
try-runtime = [
	"cumulus-pallet-parachain-system/try-runtime",
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-authorship/try-runtime",
	"pallet-session/try-runtime",
	"sp-runtime/try-runtime",
]
