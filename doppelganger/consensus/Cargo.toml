[package]
name = "doppelganger-consensus"
version = "0.1.0"
edition = "2021"

[dependencies]
sc-client-api = { workspace = true, default-features = true }
sc-chain-spec = { workspace = true, default-features = true }
sc-consensus = { workspace = true, default-features = true }
sc-executor = { workspace = true, default-features = true }
sp-authority-discovery = {workspace = true, default-features = true}
sp-runtime = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-storage = { workspace = true, default-features = true }
sp-trie = { workspace = true, default-features = true }
sp-runtime-interface = { workspace = true, features = ["std"], default-features = true }
hex = { workspace = true, default-features = true }
hex-literal = { workspace = true, default-features = true }
log = { workspace = true, default-features = true }
async-trait = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
bincode = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
polkadot-primitives = { workspace = true, features = ["std"], default-features = true}
codec = { version = "3.6.12", default-features = false, package = "parity-scale-codec" }
polkadot-runtime-parachains = { workspace = true, default-features = true }

cumulus-primitives-proof-size-hostfunction = { workspace = true, default-features = true }
sp-io = { workspace = true, default-features = true }
# RFC-163 elliptic-curve host functions. Needed by the throwaway WasmExecutor below that
# resolves the state version: without them, instantiating any runtime importing
# `ext_host_calls_bls12_381_*` / `ext_host_calls_ed_on_bls12_381_bandersnatch_mul` fails.
# Same dep line as polkadot/node/core/pvf/common and cumulus/client/service.
sp-crypto-ec-utils = { workspace = true, default-features = true, features = ["rfc163"] }
# Statement-store host functions: People/individuality imports
# `ext_statement_store_remove_by_version_1`. Part of the omni-node's canonical set
# (cumulus/polkadot-omni-node/lib/src/common/types.rs).
sp-statement-store = { workspace = true, default-features = true }

frame-system = { workspace = true, default-features = true }
pallet-balances = { workspace = true, default-features = true }
futures = { workspace = true }


[features]
default = ["std"]
std = []