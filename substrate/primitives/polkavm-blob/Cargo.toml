[package]
name = "sp-polkavm-blob"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Read and modify custom sections of PolkaVM program blobs"
documentation = "https://docs.rs/sp-polkavm-blob"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
polkavm-common = { workspace = true }

[dev-dependencies]
polkavm = { workspace = true }

[features]
default = ["std"]
std = ["polkavm-common/std"]