[package]
name = "sp-additional-data"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "Host function and providers for reading relay/JAM chain state into a block's additional data."
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
codec = { workspace = true }
hash-db = { workspace = true }
sp-crypto-hashing = { workspace = true }
sp-externalities = { workspace = true }
sp-runtime-interface = { workspace = true }
sp-state-machine = { workspace = true, optional = true }
sp-trie = { workspace = true, optional = true }

[dev-dependencies]
sp-core = { workspace = true, default-features = true }
sp-io = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"hash-db/std",
	"sp-crypto-hashing/std",
	"sp-externalities/std",
	"sp-runtime-interface/std",
	"sp-state-machine",
	"sp-state-machine?/std",
	"sp-trie",
	"sp-trie?/std",
]
