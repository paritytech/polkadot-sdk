[package]
name = "pallet-bootnodes-cli"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Command line tool to inspect pallet-bootnodes and produce signed bootnode entries"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "bootnodes-cli"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, default-features = true }
array-bytes = { workspace = true, default-features = true }
clap = { features = ["derive"], workspace = true }
codec = { workspace = true, default-features = true }
frame-metadata = { features = ["current"], workspace = true, default-features = true }
jsonrpsee = { features = ["http-client", "ws-client"], workspace = true }
multiaddr = { workspace = true }
pallet-bootnodes = { workspace = true, default-features = true }
sc-network-types = { workspace = true, default-features = true }
serde = { features = ["derive"], workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-crypto-hashing = { workspace = true, default-features = true }
tokio = { features = ["macros", "rt-multi-thread"], workspace = true }
zeroize = { workspace = true, default-features = true }
