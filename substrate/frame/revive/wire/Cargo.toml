[package]
name = "pallet-revive-wire"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Wire types and versioned interfaces for pallet-revive."

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
pallet-revive-proc-macro = { workspace = true, default-features = false }
scale-info = { features = ["derive"], workspace = true }
serde = { features = ["alloc", "derive"], workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"pallet-revive-proc-macro/std",
	"scale-info/std",
	"serde/std",
]
