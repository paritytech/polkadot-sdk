[package]
name = "pallet-proxy"
version = "28.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "FRAME proxying pallet"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["max-encoded-len"], workspace = true }
frame = { workspace = true, features = ["runtime"] }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }

[dev-dependencies]
pallet-balances = { workspace = true, default-features = true }
pallet-utility = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame/std",
	"log/std",
	"scale-info/std",
]
runtime-benchmarks = [
	"frame/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-utility/runtime-benchmarks",
]
try-runtime = [
	"frame/try-runtime",
	"pallet-balances/try-runtime",
	"pallet-utility/try-runtime",
]
# Promotes the `try_state` deposit-amount checks from a warning to a hard error.
#
# The stored deposits legitimately go stale on a live chain when governance changes a `*Deposit*`
# parameter, and stay stale until each account calls `poke_deposit`, so those checks only warn by
# default. Parameters are constant for the length of a fuzzing campaign, which makes the deposit
# formula a hard invariant there, and a fuzzer reads failures rather than logs.
fuzzing = []
