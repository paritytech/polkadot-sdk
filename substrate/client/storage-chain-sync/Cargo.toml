[package]
name = "sc-storage-chain-sync"
description = "Substrate storage-chain bitswap peer rotation and indexed transaction fetching service"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
cid = { workspace = true }
codec = { workspace = true, default-features = true }
log = { workspace = true, default-features = true }
sc-client-api.workspace = true
sc-client-api.default-features = true
sc-client-db.workspace = true
sc-client-db.default-features = true
sc-consensus.workspace = true
sc-consensus.default-features = true
sc-network-bitswap.workspace = true
sc-network-bitswap.default-features = true
sp-api.workspace = true
sp-api.default-features = true
sp-blockchain.workspace = true
sp-blockchain.default-features = true
sp-consensus.workspace = true
sp-consensus.default-features = true
sp-core.workspace = true
sp-core.default-features = true
sp-externalities.workspace = true
sp-externalities.default-features = true
sp-runtime.workspace = true
sp-runtime.default-features = true
sp-state-machine.workspace = true
sp-state-machine.default-features = true
sp-transaction-storage-proof.workspace = true
sp-transaction-storage-proof.default-features = true
sp-trie.workspace = true
sp-trie.default-features = true
thiserror = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["sync", "time"] }

[dev-dependencies]
rstest = { workspace = true }
sp-crypto-hashing = { default-features = true, path = "../../primitives/crypto/hashing" }
sp-tracing = { default-features = true, path = "../../primitives/tracing" }
sp-version = { default-features = true, path = "../../primitives/version" }
tokio = { workspace = true, default-features = true, features = ["macros", "rt", "sync"] }
tracing = { workspace = true, default-features = true }
tracing-log = { workspace = true, default-features = true }
tracing-subscriber = { workspace = true, default-features = true }
