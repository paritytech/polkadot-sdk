[package]
name = "sc-price-oracle"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
homepage.workspace = true
repository.workspace = true
description = "Price oracle node service: fetches, signs, gossips and provides price reports."
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
array-bytes = { workspace = true, default-features = true }
bytes = { workspace = true, default-features = true }
codec = { workspace = true, default-features = true }
futures = { workspace = true }
http-body-util = { workspace = true }
hyper = { features = ["client", "http1", "http2"], workspace = true, default-features = true }
hyper-rustls = { workspace = true }
hyper-util = { features = ["client-legacy", "http1", "http2", "tokio"], workspace = true }
log = { workspace = true, default-features = true }
parking_lot = { workspace = true, default-features = true }
prometheus-endpoint = { workspace = true, default-features = true }
rustls = { workspace = true }
sc-network = { workspace = true, default-features = true }
sc-network-gossip = { workspace = true, default-features = true }
sc-network-types = { workspace = true, default-features = true }
sp-api = { workspace = true, default-features = true }
sp-application-crypto = { workspace = true, default-features = true }
sp-blockchain = { workspace = true, default-features = true }
sp-consensus = { workspace = true, default-features = true }
sp-keystore = { workspace = true, default-features = true }
sp-price-oracle = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }
tokio = { features = ["time"], workspace = true, default-features = true }
url = { workspace = true }

[dev-dependencies]
hyper = { features = ["server"], workspace = true, default-features = true }
pallet-price-oracle = { workspace = true, default-features = true }
sc-keystore = { workspace = true, default-features = true }
sp-consensus-aura = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-tracing = { workspace = true, default-features = true }
tokio = { features = ["macros", "net", "rt-multi-thread"], workspace = true, default-features = true }
