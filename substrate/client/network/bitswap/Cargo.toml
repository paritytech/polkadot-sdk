[package]
description = "Substrate Bitswap client/server service"
name = "sc-network-bitswap"
version = "0.38.0"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/sc-network-bitswap"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true, default-features = true }
cid = { workspace = true }
futures = { workspace = true }
litep2p = { workspace = true }
log = { workspace = true, default-features = true }
prometheus-endpoint.workspace = true
prometheus-endpoint.default-features = true
rand = { workspace = true, default-features = true }
sc-client-api.workspace = true
sc-client-api.default-features = true
sc-network-common.workspace = true
sc-network-common.default-features = true
sc-network-sync.workspace = true
sc-network-sync.default-features = true
slotmap = { workspace = true }
smallvec = { workspace = true, default-features = true }
sp-core.workspace = true
sp-core.default-features = true
sp-runtime.workspace = true
sp-runtime.default-features = true
thiserror = { workspace = true }
tokio = { features = ["macros", "rt", "sync", "time"], workspace = true, default-features = true }

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }
sc-block-builder = { default-features = true, path = "../../block-builder" }
sc-network-types = { default-features = true, path = "../types" }
sp-consensus = { default-features = true, path = "../../../primitives/consensus/common" }
sp-crypto-hashing = { default-features = true, path = "../../../primitives/crypto/hashing" }
substrate-test-runtime = { path = "../../../test-utils/runtime" }
substrate-test-runtime-client = { path = "../../../test-utils/runtime/client" }
tokio = { features = ["macros", "rt-multi-thread", "test-util"], workspace = true, default-features = true }
tokio-stream = { workspace = true }
