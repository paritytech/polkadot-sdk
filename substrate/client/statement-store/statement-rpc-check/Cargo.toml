[package]
name = "statement-rpc-check"
description = "Soak and contract checker for the statement-store v2 unstable JSON-RPC API"
version = "0.1.0"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
authors.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "setup-allowances"
path = "src/setup.rs"

[[bin]]
name = "rpc-check"
path = "src/rpc_check.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { workspace = true, features = ["derive"] }
codec = { workspace = true, features = ["std"] }
env_logger = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
sp-statement-store = { workspace = true, features = ["std", "serde"] }
sc-statement-store = { workspace = true, features = ["test-helpers"] }
subxt = { version = "0.50", features = ["jsonrpsee", "native"] }
subxt-signer = { version = "0.50", features = ["sr25519"] }
