# ============================================================================
# TEMPORARY verification workflow — DELETE AFTER CONFIRMING THE TESTS RUN.
#
# Builds the binaries needed by the migrated bridge zombienet-sdk tests
# (`bridges/testing/zombienet-sdk-tests`), fetches `substrate-relay`, and runs
# the two tests end-to-end (each spawns two relay-chain networks with Bridge Hub
# + Asset Hub parachains and drives the relayer), so we can confirm the
# migration works.
#
# It runs on the self-hosted `parity-large` runner (the bridge test spawns ~10
# nodes and is too heavy for a 4-vCPU GitHub-hosted runner). The build/test job
# runs inside the `ci-unified` image, which provides the toolchain and ships
# OpenSSL 1.1, matching what `substrate-relay` is linked against.
#
# Remove this single file once verified.
# ============================================================================
name: TEMP - Bridges zombienet-sdk tests

on:
  pull_request:
    paths:
      - "bridges/testing/**"
      - ".github/workflows/temp-bridges-zombienet-sdk.yml"
  workflow_dispatch:

concurrency:
  group: temp-bridges-zombienet-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Extract the `substrate-relay` binary from its public image. Runs on the host
  # (no container) so the Docker CLI is available, and publishes the binary as an
  # artifact for the build/test job.
  prepare-substrate-relay:
    runs-on: parity-large
    steps:
      - name: Fetch substrate-relay binary
        run: |
          set -eux
          docker create --name relay docker.io/paritytech/substrate-relay:v1.8.0
          docker cp relay:/home/user/substrate-relay ./substrate-relay
          docker rm relay
          chmod +x ./substrate-relay
      - name: Upload substrate-relay
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: substrate-relay
          path: ./substrate-relay
          if-no-files-found: error

  bridges-zombienet-sdk:
    runs-on: parity-large
    needs: prepare-substrate-relay
    timeout-minutes: 180
    container:
      image: docker.io/paritytech/ci-unified:bullseye-1.93.0-2026-01-27-v202605151311
      # PVF workers need elevated privileges to set up their sandbox.
      options: --privileged
    env:
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
      # Use the native zombienet provider (run the binaries we put on PATH);
      # zombienet-sdk otherwise defaults to the Docker provider.
      ZOMBIE_PROVIDER: native
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare environment
        run: |
          set -eux
          git config --global --add safe.directory '*'
          # `ci-unified` already provides these; add them defensively.
          rustup target add wasm32v1-none || true
          rustup component add rust-src || true
          apt-get update && apt-get install -y --no-install-recommends procps || true

      - name: Download substrate-relay
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: substrate-relay
          path: ./relay-bin

      - name: Build polkadot (fast-runtime)
        run: cargo build --release -p polkadot --features fast-runtime

      - name: Build polkadot-parachain
        run: cargo build --release -p polkadot-parachain-bin

      - name: Run bridge zombienet-sdk tests
        run: |
          set -eux
          chmod +x "$GITHUB_WORKSPACE/relay-bin/substrate-relay"
          export PATH="$GITHUB_WORKSPACE/target/release:$PATH"
          export SUBSTRATE_RELAY_BINARY="$GITHUB_WORKSPACE/relay-bin/substrate-relay"
          polkadot --version
          polkadot-parachain --version
          "$SUBSTRATE_RELAY_BINARY" --version
          # The two tests bind fixed RPC ports (9942/8943/...), so they must run
          # serially (`--test-threads=1`) rather than in parallel.
          cargo test -p bridges-zombienet-sdk-tests \
            --features zombie-ci,zombie-metadata \
            -- --nocapture --test-threads=1

      - name: Upload zombienet logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temp-bridges-zombienet-sdk-logs
          path: |
            /tmp/zombie*/**/*.log
          if-no-files-found: ignore
