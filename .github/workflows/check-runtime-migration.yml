name: check-runtime-migration

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Take a snapshot at 5am when most SDK devs are not working. The later runs only retry the
  # networks that do not have a snapshot from today yet.
  schedule:
    - cron: "0 5,11,17,23 * * *"
  merge_group:
  workflow_dispatch:

concurrency:
  # Scheduled runs refresh the master snapshots. They get their own group so that a push to
  # master does not cancel them, and a new scheduled run waits for a running one to finish.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions: {}

jobs:
  isdraft:
    uses: ./.github/workflows/reusable-isdraft.yml
  preflight:
    needs: isdraft
    uses: ./.github/workflows/reusable-preflight.yml

  # Prepare snapshots for all networks. Runs before the actual migration checks.
  # For scheduled runs: create a fresh snapshot unless one from today is cached. Scheduled runs
  # do not depend on changed files, since they only refresh the cache.
  # For other runs: use cached snapshots if available, create if not.
  # Only master saves snapshots to the cache. Other refs cannot share their caches and would
  # evict the master ones, so they hand a fresh snapshot to the check job as an artifact.
  prepare-snapshots:
    runs-on: ubuntu-latest
    needs: [preflight]
    if: ${{ needs.preflight.outputs.changes_rust || github.event_name == 'schedule' }}
    permissions:
      # Delete superseded snapshot caches.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        network:
          [
            westend,
            asset-hub-westend,
            bridge-hub-westend,
            collectives-westend,
            coretime-westend,
          ]
        include:
          - network: westend
            uri: "wss://try-runtime-westend.polkadot.io:443"
          - network: asset-hub-westend
            uri: "wss://westend-asset-hub-rpc.polkadot.io:443"
          - network: bridge-hub-westend
            uri: "wss://westend-bridge-hub-rpc.polkadot.io:443"
          - network: collectives-westend
            uri: "wss://westend-collectives-rpc.polkadot.io:443"
          - network: coretime-westend
            uri: "wss://westend-coretime-rpc.polkadot.io:443"
    steps:
      - name: Get Date
        id: get-date
        run: |
          echo "today=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT

      # The cache prefix-matches the key. Scheduled runs look for a snapshot from today, other
      # runs accept any snapshot.
      - name: Check if snapshot exists in cache
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          path: snapshot.raw
          key: try-runtime-snapshot-${{ matrix.network }}-${{ github.event_name == 'schedule' && steps.get-date.outputs.today || '' }}
          fail-on-cache-miss: false

      - name: Download CLI
        if: ${{ steps.cache-restore.outputs.cache-matched-key == '' }}
        run: |
          curl -sL https://github.com/paritytech/try-runtime-cli/releases/download/v0.10.1/try-runtime-x86_64-unknown-linux-musl -o try-runtime
          chmod +x ./try-runtime
          ./try-runtime --version

      - name: Generate snapshot for ${{ matrix.network }}
        if: ${{ steps.cache-restore.outputs.cache-matched-key == '' }}
        run: |
          echo "Generating snapshot for ${{ matrix.network }}..."
          for i in {1..10}; do
            echo "Snapshot creation attempt $i/10"
            if ./try-runtime create-snapshot --uri ${{ matrix.uri }} -- snapshot.raw; then
              if [ -f "snapshot.raw" ] && [ -s "snapshot.raw" ]; then
                echo "Snapshot created successfully"
                break
              fi
            fi
            echo "Snapshot creation failed, attempt $i/10"
            rm -f snapshot.raw
            if [ $i -eq 10 ]; then
              echo "All snapshot creation attempts failed"
              exit 1
            fi
            sleep 10
          done

      - name: Save snapshot to cache
        if: ${{ steps.cache-restore.outputs.cache-matched-key == '' && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: snapshot.raw
          key: try-runtime-snapshot-${{ matrix.network }}-${{ steps.get-date.outputs.today }}

      - name: Upload snapshot as artifact
        if: ${{ steps.cache-restore.outputs.cache-matched-key == '' && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: try-runtime-snapshot-${{ matrix.network }}
          path: snapshot.raw
          retention-days: 1
          overwrite: true

      # Older master snapshots and copies left by PR and merge queue refs would fill the
      # repository cache and evict the current master snapshot. Delete them once the new entry
      # is listed, whatever their ref.
      - name: Delete superseded snapshots for ${{ matrix.network }}
        if: ${{ steps.cache-restore.outputs.cache-matched-key == '' && github.ref == 'refs/heads/master' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: try-runtime-snapshot-${{ matrix.network }}-${{ steps.get-date.outputs.today }}
        run: |
          for _ in {1..5}; do
            if gh cache list --key "$KEY" --ref refs/heads/master --json key --jq '.[].key' | grep -qx "$KEY"; then
              gh cache list --key "try-runtime-snapshot-${{ matrix.network }}-" --limit 1000 --json id,key,ref \
                --jq '.[] | select(.key != env.KEY or .ref != "refs/heads/master") | "\(.id) \(.key) \(.ref)"' |
              while read -r id key ref; do
                echo "Deleting superseded snapshot $key ($ref)"
                gh cache delete "$id" < /dev/null || echo "::warning::Failed to delete $key ($ref)"
              done
              exit 0
            fi
            sleep 10
          done
          echo "::warning::$KEY is not listed, keeping older snapshots"

  # More info can be found here: https://github.com/paritytech/polkadot/pull/5865
  check-runtime-migration:
    runs-on: ${{ needs.preflight.outputs.RUNNER }}
    if: ${{ needs.preflight.outputs.changes_rust && github.event_name != 'schedule' }}
    timeout-minutes: 120
    needs: [preflight, prepare-snapshots]
    container:
      image: ${{ needs.preflight.outputs.IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        network:
          [
            westend,
            asset-hub-westend,
            bridge-hub-westend,
            collectives-westend,
            coretime-westend,
          ]
        include:
          - network: westend
            package: westend-runtime
            wasm: westend_runtime.compact.compressed.wasm
            subcommand_extra_args: "--no-weight-warnings --blocktime 6000"
            command_extra_args: ""
          - network: asset-hub-westend
            package: asset-hub-westend-runtime
            wasm: asset_hub_westend_runtime.compact.compressed.wasm
            subcommand_extra_args: " --blocktime 24000"
            command_extra_args: ""
          - network: bridge-hub-westend
            package: bridge-hub-westend-runtime
            wasm: bridge_hub_westend_runtime.compact.compressed.wasm
            subcommand_extra_args: " --blocktime 24000"
            command_extra_args: ""
          - network: collectives-westend
            package: collectives-westend-runtime
            wasm: collectives_westend_runtime.compact.compressed.wasm
            command_extra_args: "--disable-spec-name-check"
            subcommand_extra_args: " --blocktime 24000"
          - network: coretime-westend
            package: coretime-westend-runtime
            wasm: coretime_westend_runtime.compact.compressed.wasm
            subcommand_extra_args: " --blocktime 24000"
            command_extra_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CLI
        run: |
          curl -sL https://github.com/paritytech/try-runtime-cli/releases/download/v0.10.1/try-runtime-x86_64-unknown-linux-musl -o try-runtime
          chmod +x ./try-runtime
          echo "Using try-runtime-cli version:"
          ./try-runtime --version

      - name: Restore snapshot from cache
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: snapshot.raw
          key: try-runtime-snapshot-${{ matrix.network }}-
          fail-on-cache-miss: false

      - name: Download snapshot artifact
        if: ${{ steps.cache-restore.outputs.cache-matched-key == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: try-runtime-snapshot-${{ matrix.network }}

      - name: Build Runtime
        id: required1
        run: |
          echo "---------- Building ${{ matrix.package }} runtime ----------"
          forklift cargo build --release --locked -p ${{ matrix.package }} --features try-runtime -q

      - name: Run Check
        id: required2
        run: |
          echo "Running ${{ matrix.network }} runtime migration check"
          export RUST_LOG=remote-ext=debug,runtime=debug

          echo "---------- Executing on-runtime-upgrade for ${{ matrix.network }} ----------"
          ./try-runtime ${{ matrix.command_extra_args }} \
              --runtime ./target/release/wbuild/${{ matrix.package }}/${{ matrix.wasm }} \
              on-runtime-upgrade --disable-spec-version-check --checks=all ${{ matrix.subcommand_extra_args }} snap -p snapshot.raw
          sleep 5

      - name: Stop all workflows if failed
        if: ${{ failure() && (steps.required1.conclusion == 'failure' || steps.required2.conclusion == 'failure') }}
        uses: ./.github/actions/workflow-stopper
        with:
          app-id: ${{ secrets.WORKFLOW_STOPPER_RUNNER_APP_ID }}
          app-key: ${{ secrets.WORKFLOW_STOPPER_RUNNER_APP_KEY }}

  # name of this job must be unique across all workflows
  # otherwise GitHub will mark all these jobs as required
  confirm-required-checks-passed:
    runs-on: ubuntu-latest
    name: All runtime migrations passed
    # If any new job gets added, be sure to add it to this array
    needs: [preflight, prepare-snapshots, check-runtime-migration]
    if: always() && !cancelled() && github.event_name != 'schedule'
    steps:
      - run: |
          tee resultfile <<< '${{ toJSON(needs) }}'
          FAILURES=$(cat resultfile | grep -E '"result": "(failure|cancelled)"' | wc -l)
          if [ $FAILURES -gt 0 ]; then
            echo "### At least one required job failed ❌" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo '### Good job! All the required jobs passed 🚀' >> $GITHUB_STEP_SUMMARY
          fi
