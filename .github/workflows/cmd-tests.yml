name: Command Bot Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isdraft:
    uses: ./.github/workflows/reusable-isdraft.yml
  test-cmd-bot:
    runs-on: ubuntu-latest
    needs: [isdraft]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Python CI scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-scripts-venv"
          "$RUNNER_TEMP/ci-scripts-venv/bin/python" -m pip install \
            -r .github/scripts/requirements-test.txt
          "$RUNNER_TEMP/ci-scripts-venv/bin/python" -m pytest .github/scripts
