name: Zombienet Statement Store Soak

# On-demand statement-store on the zombienet k8s cluster: runs when a PR carries the
# `A6-statement-store` label (and again on every push while it does), or via manual dispatch.
# Not part of the default per-PR zombienet matrix. Needs a completed "Build and push images"
# run for the commit — if the label lands before that build finishes, re-run this workflow.

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      test_pattern:
        type: string
        description: "Run tests which names match this pattern (also flaky)"
        default: ""
        required: false
      soak_secs:
        type: string
        description: "Soak window in seconds (STATEMENT_V2_SOAK_SECS)"
        default: "900"
        required: false
      soak_nodes:
        type: string
        description: "Statement node count (STATEMENT_V2_SOAK_NODES); above 51 the topology goes sparse"
        default: "12"
        required: false
      build_run_id:
        type: string
        description: "Build run to take images and the test archive from (default: resolve it)"
        default: ""
        required: false

concurrency:
  group: statement-store-soak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: 1
  GHA_CLUSTER_SERVER_ADDR: "https://kubernetes.default:443"
  NEXTEST_RETRIES: 0
  KUBECONFIG: "/data/config"
  ZOMBIE_CLEANER_DISABLED: 1

jobs:
  resolve-build:
    # The label is the opt-in – no draft gate.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.label.name, 'A6-statement-store') || contains(github.event.pull_request.labels.*.name, 'A6-statement-store') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_run_id: ${{ steps.pick.outputs.build_run_id }}
      images_version: ${{ steps.pick.outputs.images_version }}
    steps:
      - name: Pick the build run carrying this commit's images and test archive
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OVERRIDE: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          # Nodes are spawned from the Docker Hub images, tagged <pr>-<short sha>. The temp-images
          # registry cannot be used: the build stamps those tags with its own timestamp, which
          # nothing downstream knows.
          if [[ -n "${PR_NUMBER}" ]]; then
            echo "images_version=${PR_NUMBER}-${HEAD_SHA:0:8}" >> "$GITHUB_OUTPUT"
          else
            echo "images_version=master-${HEAD_SHA:0:8}" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${OVERRIDE}" ]]; then
            echo "build_run_id=${OVERRIDE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The preflight's own auto-detection waits for a fully successful build run. A build
          # run also builds images this soak never uses and then waits on the test suites it
          # triggers, so it blocks on both unrelated failures and unrelated runtime; take any
          # run of this commit whose jobs below are green instead.
          required=(
            prepare-cumulus-zombienet-artifacts
            build-push-image-polkadot-parachain-debug
            build-push-image-polkadot-debug
          )
          runs=$(gh run list --repo "$REPO" --workflow build-publish-images.yml \
            --branch "$BRANCH" --limit 20 --json databaseId,headSha \
            --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId")
          for id in $runs; do
            jobs=$(gh run view "$id" --repo "$REPO" --json jobs)
            green=true
            for job in "${required[@]}"; do
              conclusion=$(jq -r --arg job "$job" \
                '[.jobs[] | select(.name == $job) | .conclusion] | first // "missing"' <<< "$jobs")
              [[ "$conclusion" == "success" ]] || green=false
            done
            if [[ "$green" == "true" ]]; then
              echo "Using build run $id"
              echo "build_run_id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No completed build-publish-images run for ${HEAD_SHA} has all of: ${required[*]}"
          exit 1

  preflight:
    needs: [resolve-build]
    uses: ./.github/workflows/zombienet-reusable-preflight.yml
    with:
      tests_yaml: .github/zombienet-tests/zombienet_statement_store_soak_tests.yml
      test_pattern: ${{ inputs.test_pattern }}
      build_run_id: ${{ needs.resolve-build.outputs.build_run_id }}

  zombienet-statement-store-soak:
    name: ${{ matrix.test.job-name }}
    # The in-cluster runner (ZOMBIENET_SDK_RUNNER_FOR_K8S in .github/zombienet-env), pinned here
    # because the preflight outputs carry the flavour selected there (native). The image is the
    # current zombienet release rather than the v1.3.133 that file still names; ci-unified does
    # not fit — it is twice the size and the runner ran out of disk pulling it.
    runs-on: parity-zombienet
    timeout-minutes: 90
    needs: [resolve-build, preflight]
    container:
      image: docker.io/paritytech/zombienet:v1.3.140
    env:
      POLKADOT_IMAGE: "docker.io/paritypr/polkadot-debug:${{ needs.resolve-build.outputs.images_version }}"
      CUMULUS_IMAGE: "docker.io/paritypr/${{ matrix.test.cumulus-image }}:${{ needs.resolve-build.outputs.images_version }}"
      RUST_LOG: ${{ needs.preflight.outputs.RUST_LOG }}
      ZOMBIE_PROVIDER: "k8s"
      STATEMENT_V2_SOAK_SECS: ${{ inputs.soak_secs || '900' }}
      STATEMENT_V2_SOAK_NODES: ${{ inputs.soak_nodes || '12' }}

    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.preflight.outputs.TEST_MATRIX) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reuse the namespace the runner was given
        shell: bash
        run: |
          # The runner's kubernetes mode pre-creates a namespace for the job and scopes its
          # service account to it, so the provider has to spawn there instead of creating its
          # own namespace. The action only exports this when ZOMBIENET_SDK_DEFAULT_RUNNER is in
          # the job environment, which no workflow sets.
          echo "ZOMBIE_K8S_CI_NAMESPACE=$(cat /data/namespace)" >> "$GITHUB_ENV"

      - name: zombienet_test
        timeout-minutes: 80
        uses: ./.github/actions/zombienet-sdk
        with:
          test-filter: ${{ matrix.test.test-filter }}
          job-name: ${{ matrix.test.job-name }}
          prefix: "cumulus"
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          build-id: ${{ needs.preflight.outputs.BUILD_RUN_ID }}
          ref-slug: ${{ needs.preflight.outputs.SOURCE_REF_SLUG }}
          app-id: ${{ secrets.ARTIFACTS_DOWNLOADER_APP_ID }}
          app-private-key: ${{ secrets.ARTIFACTS_DOWNLOADER_PRIVATE_KEY }}

      - name: process_logs
        if: ${{ always() }}
        shell: bash
        run: |
          echo "Processing log files"
          echo "::group::Logs"
          # do not fail the whole run if this step fails
          if ! ./.github/scripts/process-logs-zombienet.sh ; then
            echo "::endgroup::"
            echo "::warning ::WARNING: Failed to process logs"
          else
            echo "::endgroup::"
          fi

      - name: upload_logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: zombienet-logs-${{ matrix.test.job-name }}-${{ github.sha }}
          path: |
            /tmp/zombie*/logs/*
