name: Zombienet Statement Store Soak

# On-demand statement-store on the zombienet k8s cluster: runs when a PR carries the
# `A6-statement-store` label (and again on every push while it does), or via manual dispatch.
# Not part of the default per-PR zombienet matrix. Needs a completed "Build and push images"
# run for the head — if the label lands before that build finishes, re-run this workflow.

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      test_pattern:
        type: string
        description: "Run tests which names match this pattern (also flaky)"
        default: ""
        required: false
      soak_secs:
        type: string
        description: "Soak window in seconds (STATEMENT_V2_SOAK_SECS)"
        default: "900"
        required: false
      soak_nodes:
        type: string
        description: "Statement node count (STATEMENT_V2_SOAK_NODES); above 51 the topology goes sparse"
        default: "12"
        required: false

concurrency:
  group: statement-store-soak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: 1
  GHA_CLUSTER_SERVER_ADDR: "https://kubernetes.default:443"
  NEXTEST_RETRIES: 0
  KUBECONFIG: "/data/config"
  ZOMBIE_CLEANER_DISABLED: 1

jobs:
  preflight:
    # The label is the opt-in – no draft gate.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.label.name, 'A6-statement-store') || contains(github.event.pull_request.labels.*.name, 'A6-statement-store') }}
    uses: ./.github/workflows/zombienet-reusable-preflight.yml
    with:
      tests_yaml: .github/zombienet-tests/zombienet_statement_store_soak_tests.yml
      test_pattern: ${{ inputs.test_pattern }}
      # Required input; empty makes the preflight auto-detect the branch's latest successful
      # "Build and push images" run.
      build_run_id: ""

  zombienet-statement-store-soak:
    name: ${{ matrix.test.job-name }}
    # The in-cluster k8s runner (ZOMBIENET_SDK_RUNNER_FOR_K8S in .github/zombienet-env), pinned
    # here because the preflight outputs carry the flavour selected there (currently native).
    runs-on: parity-zombienet
    timeout-minutes: 90
    needs: [preflight]
    container:
      image: docker.io/paritytech/ci-unified:bullseye-1.93.0-2026-01-27-v202605151311
    env:
      POLKADOT_IMAGE: "${{ needs.preflight.outputs.TEMP_IMAGES_BASE }}/polkadot-debug:${{ needs.preflight.outputs.DOCKER_IMAGES_VERSION }}"
      CUMULUS_IMAGE: "${{ needs.preflight.outputs.TEMP_IMAGES_BASE }}/${{ matrix.test.cumulus-image }}:${{ needs.preflight.outputs.DOCKER_IMAGES_VERSION }}"
      RUST_LOG: ${{ needs.preflight.outputs.RUST_LOG }}
      ZOMBIE_PROVIDER: "k8s"
      STATEMENT_V2_SOAK_SECS: ${{ inputs.soak_secs || '900' }}
      STATEMENT_V2_SOAK_NODES: ${{ inputs.soak_nodes || '12' }}

    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.preflight.outputs.TEST_MATRIX) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: zombienet_test
        timeout-minutes: 80
        uses: ./.github/actions/zombienet-sdk
        with:
          test-filter: ${{ matrix.test.test-filter }}
          job-name: ${{ matrix.test.job-name }}
          prefix: "cumulus"
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          build-id: ${{ needs.preflight.outputs.BUILD_RUN_ID }}
          ref-slug: ${{ needs.preflight.outputs.SOURCE_REF_SLUG }}
          app-id: ${{ secrets.ARTIFACTS_DOWNLOADER_APP_ID }}
          app-private-key: ${{ secrets.ARTIFACTS_DOWNLOADER_PRIVATE_KEY }}

      - name: process_logs
        if: ${{ always() }}
        shell: bash
        run: |
          echo "Processing log files"
          echo "::group::Logs"
          # do not fail the whole run if this step fails
          if ! ./.github/scripts/process-logs-zombienet.sh ; then
            echo "::endgroup::"
            echo "::warning ::WARNING: Failed to process logs"
          else
            echo "::endgroup::"
          fi

      - name: upload_logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: zombienet-logs-${{ matrix.test.job-name }}-${{ github.sha }}
          path: |
            /tmp/zombie*/logs/*
