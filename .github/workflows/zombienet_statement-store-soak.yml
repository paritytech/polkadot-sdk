name: Zombienet Statement Store Soak

# On-demand statement-store on the zombienet k8s cluster: runs when a PR carries the
# `A6-statement-store` label (and again on every push while it does), or via manual dispatch.
# Not part of the default per-PR zombienet matrix. Needs a completed "Build and push images"
# run for the commit – if the label lands before that build finishes, re-run this workflow.
on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      test_pattern:
        type: string
        description: "Run tests which names match this pattern (also flaky)"
        default: ""
        required: false
      soak_secs:
        type: string
        description: "Soak window in seconds; overrides the matrix entry"
        default: ""
        required: false
      soak_nodes:
        type: string
        description: "Statement node count; overrides the matrix entry. Above 51 the topology goes sparse"
        default: ""
        required: false
      build_run_id:
        type: string
        description: "Build run to take images and the test archive from (default: resolve it)"
        default: ""
        required: false

concurrency:
  group: statement-store-soak-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: read-all

env:
  GHA_CLUSTER_SERVER_ADDR: "https://kubernetes.default:443"
  KUBECONFIG: "/data/config"
  ZOMBIE_CLEANER_DISABLED: 1

jobs:
  resolve-build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.label.name, 'A6-statement-store') || contains(github.event.pull_request.labels.*.name, 'A6-statement-store') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      build_run_id: ${{ steps.pick.outputs.build_run_id }}
      images_version: ${{ steps.pick.outputs.images_version }}
      soak_nodes: ${{ steps.pick.outputs.soak_nodes }}
      soak_secs: ${{ steps.pick.outputs.soak_secs }}
    steps:
      - name: Pick the build run carrying this commit's images and test archive
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          OVERRIDE: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          if [[ "${IS_FORK}" == "true" ]]; then
            echo "::error::A fork's build pushes no Docker Hub image (no paritypr credentials), and the soak spawns its nodes from there."
            exit 1
          fi
          # A dispatch carries no pull request, so take its number from the branch: the Docker
          # Hub tag is <pr>-<short sha>, and master- is only right off a pull request.
          images_pr="${PR_NUMBER}"
          if [[ -z "${images_pr}" ]]; then
            images_pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
              --json number --jq '.[0].number // empty' || true)
          fi
          if [[ -n "${images_pr}" ]]; then
            echo "images_version=${images_pr}-${HEAD_SHA:0:8}" >> "$GITHUB_OUTPUT"
          else
            echo "images_version=master-${HEAD_SHA:0:8}" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${PR_NUMBER}" ]]; then
            body=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body || true)
            directive=$(grep -oiE '^[[:space:]]*soak:.*' <<< "$body" | tail -1 || true)
            nodes=$(grep -oiE 'nodes=[0-9]+' <<< "$directive" | grep -oE '[0-9]+' || true)
            secs=$(grep -oiE 'secs=[0-9]+' <<< "$directive" | grep -oE '[0-9]+' || true)
            [[ -n "$nodes" ]] && echo "soak_nodes=$nodes" >> "$GITHUB_OUTPUT"
            [[ -n "$secs" ]] && echo "soak_secs=$secs" >> "$GITHUB_OUTPUT"
            [[ -n "$directive" ]] && echo "Sizing from the pull request body: ${directive}"
          fi
          if [[ -n "${OVERRIDE}" ]]; then
            echo "build_run_id=${OVERRIDE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          required=(
            prepare-cumulus-zombienet-artifacts
            build-push-image-polkadot-parachain-debug
            build-push-image-polkadot-debug
          )
          deadline=$(( SECONDS + 35 * 60 ))
          while :; do
            runs=$(gh run list --repo "$REPO" --workflow build-publish-images.yml \
              --branch "$BRANCH" --limit 20 --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" || true)
            pending=false
            blocked=""
            for id in $runs; do
              jobs=$(gh run view "$id" --repo "$REPO" --json jobs || true)
              green=true
              for job in "${required[@]}"; do
                state=$(jq -r --arg job "$job" \
                  '[.jobs[] | select(.name == $job) | "\(.status):\(.conclusion)"] | first // "absent:none"' \
                  <<< "$jobs")
                case "$state" in
                  completed:success) ;;
                  completed:*) green=false; blocked+="  run $id: $job is ${state#completed:}"$'\n' ;;
                  *) green=false; pending=true ;;
                esac
              done
              if [[ "$green" == "true" ]]; then
                echo "Using build run $id"
                echo "build_run_id=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            if [[ -n "$runs" && "$pending" == "false" ]]; then
              echo "::error::No build-publish-images run for ${HEAD_SHA} can serve this soak:"
              echo "$blocked"
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Timed out waiting for a build-publish-images run of ${HEAD_SHA} with: ${required[*]}"
              exit 1
            fi
            echo "Waiting for the build of ${HEAD_SHA:0:8} to produce: ${required[*]}"
            sleep 30
          done

  preflight:
    needs: [resolve-build]
    uses: ./.github/workflows/zombienet-reusable-preflight.yml
    with:
      tests_yaml: .github/zombienet-tests/zombienet_statement_store_soak_tests.yml
      test_pattern: ${{ inputs.test_pattern }}
      build_run_id: ${{ needs.resolve-build.outputs.build_run_id }}

  zombienet-statement-store-soak:
    name: ${{ matrix.test.job-name }}
    runs-on: parity-zombienet
    # Spawning the pods and then soaking them takes a while.
    timeout-minutes: 150
    needs: [resolve-build, preflight]
    container:
      image: docker.io/paritytech/zombienet:v1.3.140
    env:
      POLKADOT_IMAGE: "docker.io/paritypr/polkadot-debug:${{ needs.resolve-build.outputs.images_version }}"
      CUMULUS_IMAGE: "docker.io/paritypr/${{ matrix.test.cumulus-image }}:${{ needs.resolve-build.outputs.images_version }}"
      RUST_LOG: ${{ needs.preflight.outputs.RUST_LOG }}
      ZOMBIE_PROVIDER: "k8s"
      STATEMENT_V2_SOAK_SECS: ${{ inputs.soak_secs || needs.resolve-build.outputs.soak_secs || matrix.test.soak-secs }}
      STATEMENT_V2_SOAK_NODES: ${{ inputs.soak_nodes || needs.resolve-build.outputs.soak_nodes || matrix.test.soak-nodes }}

    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.preflight.outputs.TEST_MATRIX) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reuse the namespace the runner was given
        shell: bash
        run: |
          echo "ZOMBIE_K8S_CI_NAMESPACE=$(cat /data/namespace)" >> "$GITHUB_ENV"

      - name: zombienet_test
        timeout-minutes: 140
        uses: ./.github/actions/zombienet-sdk
        with:
          test-filter: ${{ matrix.test.test-filter }}
          job-name: ${{ matrix.test.job-name }}
          prefix: "cumulus"
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          build-id: ${{ needs.preflight.outputs.BUILD_RUN_ID }}
          ref-slug: ${{ needs.preflight.outputs.SOURCE_REF_SLUG }}
          app-id: ${{ secrets.ARTIFACTS_DOWNLOADER_APP_ID }}
          app-private-key: ${{ secrets.ARTIFACTS_DOWNLOADER_PRIVATE_KEY }}

      - name: process_logs
        if: ${{ always() }}
        shell: bash
        run: |
          echo "Processing log files"
          echo "::group::Logs"
          if ! ./.github/scripts/process-logs-zombienet.sh ; then
            echo "::endgroup::"
            echo "::warning ::WARNING: Failed to process logs"
          else
            echo "::endgroup::"
          fi

      - name: upload_logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: zombienet-logs-${{ matrix.test.job-name }}-${{ github.sha }}
          path: |
            /tmp/zombie*/logs/*
