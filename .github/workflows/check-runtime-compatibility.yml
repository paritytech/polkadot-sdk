name: check-runtime-compatibility

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  isdraft:
    uses: ./.github/workflows/reusable-isdraft.yml
  preflight:
    needs: isdraft
    uses: ./.github/workflows/reusable-preflight.yml

  check-runtime-compatibility:
    runs-on: ${{ needs.preflight.outputs.RUNNER }}
    if: ${{ needs.preflight.outputs.changes_rust }}
    timeout-minutes: 30
    needs: [preflight]
    container:
      image: ${{ needs.preflight.outputs.IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        network:
          [
            westend,
            asset-hub-westend,
            bridge-hub-westend,
            collectives-westend,
            coretime-westend,
            people-westend,
          ]
        include:
          - network: westend
            package: westend-runtime
            wasm: westend_runtime.compact.compressed.wasm
            uri: "wss://try-runtime-westend.polkadot.io:443"
          - network: asset-hub-westend
            package: asset-hub-westend-runtime
            wasm: asset_hub_westend_runtime.compact.compressed.wasm
            uri: "wss://westend-asset-hub-rpc.polkadot.io:443"
          - network: bridge-hub-westend
            package: bridge-hub-westend-runtime
            wasm: bridge_hub_westend_runtime.compact.compressed.wasm
            uri: "wss://westend-bridge-hub-rpc.polkadot.io:443"
          - network: collectives-westend
            package: collectives-westend-runtime
            wasm: collectives_westend_runtime.compact.compressed.wasm
            uri: "wss://westend-collectives-rpc.polkadot.io:443"
          - network: coretime-westend
            package: coretime-westend-runtime
            wasm: coretime_westend_runtime.compact.compressed.wasm
            uri: "wss://westend-coretime-rpc.polkadot.io:443"
          - network: people-westend
            package: people-westend-runtime
            wasm: people_westend_runtime.compact.compressed.wasm
            uri: "wss://westend-people-rpc.polkadot.io:443"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build Runtime
        id: build-runtime
        run: |
          echo "---------- Building ${{ matrix.package }} runtime with on-chain-release-build ----------"
          forklift cargo build --release --locked -p ${{ matrix.package }} --features on-chain-release-build -q

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24.x"
          registry-url: "https://npm.pkg.github.com"

      - name: Probe RPC endpoint connectivity
        run: |
          URI="${{ matrix.uri }}"
          HOST=$(echo "$URI" | sed 's|wss://||' | sed 's|:443||')
          echo "---------- Probing $HOST ----------"

          echo "--- DNS resolution ---"
          getent hosts "$HOST" || echo "WARNING: DNS resolution failed for $HOST"

          echo "--- TCP+TLS + HTTP status (curl) ---"
          curl -sS --max-time 10 --http1.1 \
            -o /dev/null -w "HTTP status: %{http_code}  connect: %{time_connect}s  total: %{time_total}s\n" \
            "https://$HOST/" || echo "WARNING: HTTPS probe failed (exit $?)"

          echo "--- WebSocket upgrade handshake ---"
          WS_STATUS=$(curl -sS --max-time 3 --http1.1 \
            -H "Upgrade: websocket" \
            -H "Connection: Upgrade" \
            -H "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" \
            -H "Sec-WebSocket-Version: 13" \
            -o /dev/null -w "%{http_code}" \
            "https://$HOST/" 2>/dev/null || true)
          echo "WebSocket upgrade HTTP status: $WS_STATUS"
          [ "$WS_STATUS" = "101" ] || echo "WARNING: expected 101, got $WS_STATUS"

          echo "--- JSON-RPC system_health via WebSocket ---"
          node -e "
            const ws = new WebSocket('$URI');
            const t = setTimeout(() => { console.error('ERROR: timed out after 10s'); ws.terminate(); process.exit(1); }, 10000);
            ws.onerror = (e) => { clearTimeout(t); console.error('ERROR:', e.message); process.exit(1); };
            ws.onopen  = () => { console.log('connected'); ws.send(JSON.stringify({id:1,jsonrpc:'2.0',method:'system_health',params:[]})); };
            ws.onmessage = (e) => { clearTimeout(t); console.log('system_health:', e.data); ws.close(); };
            ws.onclose = () => process.exit(0);
          "

      - name: Check Runtime Compatibility
        id: check-compatibility
        run: |
          echo "---------- Checking runtime compatibility for ${{ matrix.network }} ----------"

          # Install to a local directory so we know the exact path to cli.mjs.
          # check-runtime hardcodes LOG_LEVEL=fatal, preventing any Chopsticks debug output.
          # We patch cli.mjs so our LOG_LEVEL env var takes effect instead.
          npm install --save-exact --prefix ./check-runtime-tool @polkadot-api/check-runtime@latest 2>/dev/null
          CLI_MJS=./check-runtime-tool/node_modules/@polkadot-api/check-runtime/bin/cli.mjs
          sed -i 's/process\.env\.LOG_LEVEL = "fatal"/process.env.LOG_LEVEL = process.env.LOG_LEVEL || "fatal"/' "$CLI_MJS"

          set +e
          # check-runtime hangs indefinitely if the RPC node is unreachable.
          LOG_LEVEL=debug timeout 600 node "$CLI_MJS" problems ${{ matrix.uri }} --wasm ./target/release/wbuild/${{ matrix.package }}/${{ matrix.wasm }}
          EXIT_CODE=$?
          set -e
          # When the time limit is reached, timeout returns exit code 124
          if [ $EXIT_CODE -eq 124 ]; then
            echo "::error::Timed out connecting to ${{ matrix.uri }} for ${{ matrix.network }}"
          fi
          exit $EXIT_CODE

      - name: Stop all workflows if failed
        if: ${{ failure() && (steps.build-runtime.conclusion == 'failure' || steps.check-compatibility.conclusion == 'failure') }}
        uses: ./.github/actions/workflow-stopper
        with:
          app-id: ${{ secrets.WORKFLOW_STOPPER_RUNNER_APP_ID }}
          app-key: ${{ secrets.WORKFLOW_STOPPER_RUNNER_APP_KEY }}

  # name of this job must be unique across all workflows
  # otherwise GitHub will mark all these jobs as required
  confirm-runtime-compatibility-checks-passed:
    runs-on: ubuntu-latest
    name: All runtime compatibility checks passed
    needs: [check-runtime-compatibility]
    if: always() && !cancelled()
    steps:
      - run: |
          tee resultfile <<< '${{ toJSON(needs) }}'
          FAILURES=$(cat resultfile | grep -E '"result": "(failure|cancelled)"' | wc -l)
          if [ $FAILURES -gt 0 ]; then
            echo "### At least one required job failed ❌" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo '### Good job! All the required jobs passed 🚀' >> $GITHUB_STEP_SUMMARY
          fi
