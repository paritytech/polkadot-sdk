# Statement-store tests. Not part of the default per-PR zombienet matrix: they run on the
# zombienet k8s cluster on demand, via the `A6-statement-store` PR label or a manual
# dispatch of .github/workflows/zombienet_statement-store-soak.yml. Each entry sizes its own
# network; a dispatch can override the size and the soak window for a one-off run.

# 100 statement nodes leave the statement peer set's 50 slots behind, so this is the sparse
# topology: delivery has to route instead of handing the statement to every replica directly.
- job-name: "zombienet-statement-store-soak-0001-v2-dht-sparse"
  test-filter: "zombie_ci::statement_store::v2_dht_soak::statement_store_v2_dht_soak"
  runner-type: "default"
  cumulus-image: "polkadot-parachain-debug"
  soak-nodes: "100"
  soak-secs: "600"
