# Migrated version of 0013-systematic-chunk-recovery.toml using omninode
# This demonstrates how to use omninode instead of polkadot-parachain
#
# Key changes:
# - Uses polkadot-omni-node binary instead of polkadot-parachain
# - Requires pre-generated chain spec files (see scripts/generate-glutton-chain-specs.sh)
# - Chain specs include glutton configuration (compute, storage, trashDataCount)
#
# Benefits:
# - No need to build polkadot-parachain (saves ~20-30 minutes)
# - Single universal binary for all parachain tests
# - Runtime loaded from chain spec at runtime

[settings]
timeout = 1000
bootnode = true

[relaychain.genesis.runtimeGenesis.patch.configuration.config.scheduler_params]
  max_validators_per_core = 2

[relaychain.genesis.runtimeGenesis.patch.configuration.config]
  needed_approvals = 4

[relaychain]
default_image = "{{ZOMBIENET_INTEGRATION_TEST_IMAGE}}"
chain = "rococo-local"
default_command = "polkadot"

[relaychain.default_resources]
limits = { memory = "4G", cpu = "2" }
requests = { memory = "2G", cpu = "1" }

  [[relaychain.nodes]]
  name = "alice"
  validator = "true"

  [[relaychain.node_groups]]
  name = "validator"
  count = 3
  args = ["-lparachain=debug,parachain::availability-recovery=trace,parachain::availability-distribution=trace"]

# Parachain configuration using omninode
[[parachains]]
id = 2000
addToGenesis = true
cumulus_based = true
# Use chain spec file generated by scripts/generate-glutton-chain-specs.sh
chain_spec_path = "../../../zombienet-chain-specs/glutton-westend-local-2000-spec.json"

    [parachains.collator]
    name = "collator"
    image = "{{CUMULUS_IMAGE}}"
    # Use omninode instead of polkadot-parachain
    command = "polkadot-omni-node"
    args = ["-lparachain=debug"]

[[parachains]]
id = 2001
addToGenesis = true
cumulus_based = true
# Use chain spec file generated by scripts/generate-glutton-chain-specs.sh
chain_spec_path = "../../../zombienet-chain-specs/glutton-westend-local-2001-spec.json"

    [parachains.collator]
    name = "collator"
    image = "{{CUMULUS_IMAGE}}"
    # Use omninode instead of polkadot-parachain
    command = "polkadot-omni-node"
    args = ["-lparachain=debug"]
