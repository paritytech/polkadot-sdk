[package]
name = "polkadot-node-price-oracle"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
homepage.workspace = true
repository.workspace = true
description = "Polkadot price oracle gossip service and inherent data provider."

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
array-bytes = { workspace = true, default-features = true }
codec = { features = ["derive"], workspace = true }
log = { workspace = true, default-features = true }
parking_lot = { workspace = true, default-features = true }
sc-network = { workspace = true, default-features = true }
sc-network-types = { workspace = true, default-features = true }
reqwest = { workspace = true, default-features = true }
sp-api = { workspace = true, default-features = true }
sp-blockchain = { workspace = true, default-features = true }
sp-consensus-babe = { workspace = true, default-features = true }
sp-consensus-slots = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-keystore = { workspace = true, default-features = true }
sp-price-oracle = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["rt", "time", "macros"] }

[dev-dependencies]
futures = { workspace = true }
pallet-price-oracle = { workspace = true, default-features = true }
pallet-sudo = { workspace = true, default-features = true }
polkadot-primitives = { workspace = true, default-features = true }
polkadot-test-client = { workspace = true }
sp-consensus = { workspace = true, default-features = true }
sp-keyring = { workspace = true, default-features = true }
sp-state-machine = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }

[features]
live-test = []
