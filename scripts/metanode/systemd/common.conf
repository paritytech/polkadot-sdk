# Common settings of the metanode units (polkadot-validator, polkadot-asset-hub, polkadot-people).
#
# install.sh installs this file as polkadot-<role>.service.d/10-common.conf for each role. It is
# deliberately not a prefix drop-in (polkadot-.service.d/): that would also apply to unrelated units
# such as the polkadot-collator.service of docs.polkadot.com, and this sandbox would break them.
#
# Only settings that are the same for every role live here. List-valued sandbox settings
# (SystemCallFilter=, RestrictNamespaces=) stay in each unit: drop-ins are parsed after the unit
# file, so a deny-list here would take syscalls away from the validator's PVF sandbox.

[Unit]
# Stopping or restarting either target acts on every role.
PartOf=polkadot-metanode.target polkadot-metanode-all.target
Wants=network-online.target
After=network-online.target
# Never stop retrying: a collator waiting for its validator must keep coming back.
StartLimitIntervalSec=0

[Service]
# The nodes support no readiness notification; polkadot-metanodectl execs the node binary.
Type=exec
Slice=polkadot-metanode.slice
# Also restart on exit 0: after binaries are replaced in place, the PVF worker of the new version
# shuts the running validator down with SIGTERM.
Restart=always
# Do not restart on usage (2) or configuration (78) errors; they fail the unit visibly instead.
RestartPreventExitStatus=2 78
# SIGTERM to the node only; the PVF workers exit with it.
KillMode=mixed
# The node's own shutdown timeout is 60s, and a signal during initialisation is only handled once
# initialisation is done.
TimeoutStopSec=180
UMask=0077
StateDirectoryMode=0700

# Sandbox, from polkadot/scripts/packaging/polkadot.service plus ProtectHome= (state lives in
# /var/lib/polkadot-<role>) and ProtectKernelLogs=.
CapabilityBoundingSet=
LockPersonality=true
NoNewPrivileges=true
PrivateDevices=true
PrivateMounts=true
PrivateTmp=true
PrivateUsers=true
ProtectClock=true
ProtectControlGroups=true
ProtectHome=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectSystem=strict
RemoveIPC=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_NETLINK AF_UNIX
RestrictSUIDSGID=true
SystemCallArchitectures=native
# wasmtime compiles the runtimes and makes the code executable with mprotect; there is no
# interpreter fallback.
MemoryDenyWriteExecute=false
