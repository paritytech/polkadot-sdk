# One system user per metanode role, so a collator cannot read the validator's keystore, and the
# bandwidth reservation can tell the validator's packets apart.
# Applied by install.sh with `systemd-sysusers <this file>`.
#Type Name                        ID GECOS                            Home directory
u     polkadot-validator          -  "Polkadot validator (metanode)"  /var/lib/polkadot-validator
u     polkadot-asset-hub-collator -  "Asset Hub collator (metanode)"  /var/lib/polkadot-asset-hub-collator
u     polkadot-people-collator    -  "People collator (metanode)"     /var/lib/polkadot-people-collator
