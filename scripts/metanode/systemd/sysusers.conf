# One system user per metanode role, so a collator cannot read the validator's keystore.
# Applied by install.sh with `systemd-sysusers <this file>`.
#Type Name               ID GECOS                            Home directory
u     polkadot-validator -  "Polkadot validator (metanode)"  /var/lib/polkadot-validator
u     polkadot-asset-hub -  "Asset Hub collator (metanode)"  /var/lib/polkadot-asset-hub
u     polkadot-people    -  "People collator (metanode)"     /var/lib/polkadot-people
