# Installed by install.sh as nftables.service.d/50-polkadot-metanode-qos.conf.
#
# Starting or reloading nftables.service loads /etc/nftables.conf, which usually begins with `flush
# ruleset` and so deletes the table of polkadot-metanode-qos.service that tags the validator's
# packets. Put it back afterwards, if that unit is active. A failure here is ignored ("-"): it must
# never fail the firewall.
[Service]
ExecStartPost=-@BINDIR@/polkadot-metanodectl qos reload
ExecReload=-@BINDIR@/polkadot-metanodectl qos reload
