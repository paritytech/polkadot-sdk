# /etc/polkadot-metanode/metanode.conf: settings shared by every metanode role on this machine.
#
# Read by polkadot-metanodectl (bash syntax) when a role starts; restart a role to apply changes.
# Per-role settings (ports, chain, extra arguments) belong in /etc/polkadot-metanode/<role>.conf.

# Relay network: polkadot, kusama, westend or paseo. Required.
NETWORK=

# Telemetry and log name. Each role appends "-<role>", e.g. "acme-1-validator". Default: hostname.
#NODE_NAME=

# Relay-chain RPC endpoints the collators use, space-separated, tried in order.
# The default is the validator on this machine. For collators on a machine without a validator,
# list the validator(s) you run elsewhere (their validator.conf sets RPC_PRIVATE_IP).
# Set to "" to make every collator run its own embedded relay-chain node instead.
#RELAY_CHAIN_RPC_URLS="ws://127.0.0.1:9944"

# Seconds a collator waits for one of those endpoints before it exits and systemd retries.
#RELAY_RPC_WAIT=300

# Public IP address to advertise for p2p (adds --public-addr, also for WebRTC). Needed behind NAT.
#PUBLIC_IP=

# Serve light clients (e.g. smoldot in a browser) over WebRTC, on UDP with the same port numbers as
# the p2p TCP ports. yes or no; applies to every role unless a <role>.conf overrides it.
#WEBRTC=yes

# Directory holding polkadot and polkadot-parachain, and normally also polkadot-prepare-worker and
# polkadot-execute-worker (else the validator uses those of the polkadot package, in
# /usr/lib/polkadot). Default: the directory polkadot-metanodectl is installed in.
#BIN_DIR=
