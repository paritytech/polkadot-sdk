# /etc/polkadot-metanode/validator.conf: overrides for polkadot-validator.service (bash syntax).

# Chain: a built-in id or an absolute path to a chain spec file. Default: $NETWORK.
#CHAIN=

#P2P_PORT=30333
#RPC_PORT=9944
#PROMETHEUS_PORT=9615
#PROMETHEUS_EXTERNAL=no

# Serve RPC to collators on other machines. Localhost keeps every method (rotate-keys, status);
# this private address only gets the safe ones. Firewall the port to your collator hosts: the
# endpoint has no TLS, so use a private network or a tunnel.
#RPC_PRIVATE_IP=

# Database, history and sync. The node's defaults apply unless set; docs.polkadot.com sets none
# for validators.
#DATABASE=         # rocksdb, paritydb, auto or paritydb-experimental
#STATE_PRUNING=    # archive, archive-canonical or a number of blocks (node default: 256)
#BLOCKS_PRUNING=   # the same values (node default: archive-canonical, all finalized blocks)
#SYNC=             # full, fast, fast-unsafe or warp (node default: full)

# Extra polkadot arguments, split on whitespace. A flag set from a key above cannot be repeated.
#EXTRA_ARGS=""
