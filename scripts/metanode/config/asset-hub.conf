# /etc/polkadot-metanode/asset-hub.conf: overrides for polkadot-asset-hub.service (bash syntax).

# Chain: a built-in id or an absolute path to a chain spec file. Default: asset-hub-$NETWORK.
# Paseo is not built in: download its spec from https://paritytech.github.io/chainspecs.
#CHAIN=
# Relay chain, same rules. Default: $NETWORK.
#RELAY_CHAIN=

# slot-based or lookahead. Runtimes with a relay-parent offset need slot-based.
#AUTHORING=slot-based

#P2P_PORT=30343
#RPC_PORT=9954
#PROMETHEUS_PORT=9625
#PROMETHEUS_EXTERNAL=no
# Relay side of the collator. The RPC port is only used by the embedded relay node.
#RELAY_P2P_PORT=30344
#RELAY_RPC_PORT=9955
#RELAY_PROMETHEUS_PORT=9626

# Database, history and sync of the collator. The defaults are those of docs.polkadot.com ("Run a
# collator"); an empty value passes no flag and keeps the node's default.
#DATABASE=paritydb      # rocksdb, paritydb, auto or paritydb-experimental
#STATE_PRUNING=256      # archive, archive-canonical or a number of blocks
#BLOCKS_PRUNING=256     # the same values; the node's own default keeps all finalized blocks
#SYNC=                  # full, fast, fast-unsafe or warp
# The same for an embedded relay node (RELAY_CHAIN_RPC_URLS=""), which by default also keeps no
# transaction pool and full syncs, the node's default (not the guide's fast sync, which makes the
# collator stop and restart until it is done; see the README). Not used in RPC mode.
#RELAY_DATABASE=paritydb
#RELAY_STATE_PRUNING=256
#RELAY_BLOCKS_PRUNING=256
#RELAY_SYNC=
#RELAY_POOL_LIMIT=0

# Extra polkadot-parachain arguments, split on whitespace. A flag set from a key above cannot be
# repeated here.
#EXTRA_ARGS="" 
# Extra relay-chain arguments (passed after "--"), e.g. "--in-peers 8".
#RELAY_EXTRA_ARGS=""
