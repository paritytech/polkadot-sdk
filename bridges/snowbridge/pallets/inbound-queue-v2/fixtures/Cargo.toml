[package]
name = "snowbridge-pallet-inbound-queue-v2-fixtures"
description = "Snowbridge Inbound Queue Test Fixtures V2"
version = "0.10.0"
authors = ["Snowfork <contact@snowfork.com>"]
edition.workspace = true
repository.workspace = true
license = "Apache-2.0"
categories = ["cryptography::cryptocurrencies"]

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.polkadot-sdk]
exclude-from-umbrella = true

[dependencies]
hex-literal = { workspace = true, default-features = true }
snowbridge-beacon-primitives = { workspace = true }
snowbridge-core = { workspace = true }
snowbridge-inbound-queue-primitives = { workspace = true }
sp-core = { workspace = true }
sp-std = { workspace = true }

# Used by the v2 dynamic fixture builder under runtime-benchmarks. The shared
# SSZ / merkle / receipts-trie machinery lives in
# `snowbridge-pallet-ethereum-client-fixtures`; this crate just supplies the
# v2-specific ABI-encoded log payload on top.
alloy-core = { workspace = true, features = ["sol-types"], optional = true }
alloy-primitives = { workspace = true, optional = true }
snowbridge-pallet-ethereum-client-fixtures = { workspace = true, optional = true }

[features]
default = ["std"]
std = [
	"alloy-core?/std",
	"alloy-primitives?/std",
	"snowbridge-beacon-primitives/std",
	"snowbridge-core/std",
	"snowbridge-inbound-queue-primitives/std",
	"snowbridge-pallet-ethereum-client-fixtures?/std",
	"sp-core/std",
	"sp-std/std",
]
runtime-benchmarks = [
	"alloy-core",
	"alloy-primitives",
	"snowbridge-core/runtime-benchmarks",
	"snowbridge-inbound-queue-primitives/runtime-benchmarks",
	"snowbridge-pallet-ethereum-client-fixtures/runtime-benchmarks",
]
