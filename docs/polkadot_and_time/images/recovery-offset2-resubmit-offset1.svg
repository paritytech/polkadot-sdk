<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="sans-serif" font-size="14">
  <style>
    .axis { stroke: #333; stroke-width: 1.5; }
    .grid { stroke: #bbb; stroke-dasharray: 4,3; }
    .ok { fill: #2e8b57; }
    .bad { fill: #c00; }
    .pending { fill: #d4a017; }
    .ci { fill: #cfe4ff; stroke: #3a7bd5; }
    .cinext { fill: #efe6ff; stroke: #6a4fb5; }
    .deadline { fill: #fee; stroke: #c00; }
    .deadline-text { fill: #c00; font-weight: bold; }
    .title { font-weight: bold; font-size: 17px; fill: #2e8b57; }
    .caption { font-size: 13px; fill: #333; }
    .label { font-size: 12px; }
    .small { font-size: 10px; fill: #666; }
  </style>

  <text x="450" y="26" text-anchor="middle" class="title">Resubmission on the same core (sticky) — fits before N+3's RC author starts</text>

  <line x1="80" y1="380" x2="800" y2="380" class="axis"/>
  <line x1="80"  y1="60" x2="80"  y2="380" class="axis"/>
  <line x1="440" y1="60" x2="440" y2="380" class="grid"/>
  <line x1="800" y1="60" x2="800" y2="380" class="axis" stroke="#c00" stroke-width="2"/>

  <text x="260" y="48" text-anchor="middle" class="label" font-weight="bold">slot S+1 — C_i builds</text>
  <text x="620" y="48" text-anchor="middle" class="label" font-weight="bold">slot S+2 — resubmission window</text>

  <rect x="780" y="68" width="40" height="22" class="deadline"/>
  <text x="800" y="84" text-anchor="middle" class="deadline-text" font-size="11">N+3 starts</text>

  <text x="60" y="135" text-anchor="end" class="label" font-weight="bold">V₁</text>
  <rect x="80"  y="120" width="120" height="26" class="ci"/>
  <text x="140" y="137" text-anchor="middle" class="label">Y advert</text>
  <rect x="200" y="120" width="240" height="26" class="ci"/>
  <text x="320" y="137" text-anchor="middle" class="label">V₁ validates Y</text>
  <line x1="440" y1="133" x2="780" y2="133" stroke="#2e8b57" stroke-width="2"/>
  <polygon points="775,128 785,133 775,138" class="ok"/>
  <text x="610" y="125" text-anchor="middle" class="label ok">Y → N+3 ✓</text>

  <text x="60" y="195" text-anchor="end" class="label" font-weight="bold">V₂</text>
  <rect x="200" y="180" width="120" height="26" fill="#ffe2e2" stroke="#c00"/>
  <text x="260" y="197" text-anchor="middle" class="label">Y+1 advert</text>
  <text x="335" y="197" class="label bad" font-weight="bold">✗ V₂ fails — Y+1 lost</text>

  <text x="60" y="255" text-anchor="end" class="label" font-weight="bold">V₃</text>
  <rect x="320" y="240" width="120" height="26" fill="#fff2cc" stroke="#d4a017"/>
  <text x="380" y="257" text-anchor="middle" class="label">Y+2 advert</text>
  <rect x="440" y="240" width="120" height="26" fill="#fff2cc" stroke="#d4a017"/>
  <text x="500" y="257" text-anchor="middle" class="label">validate</text>
  <rect x="560" y="240" width="240" height="26" fill="#fff2cc" stroke="#d4a017" stroke-dasharray="3,2"/>
  <text x="680" y="257" text-anchor="middle" class="label pending">statement held (parent off-chain)</text>

  <text x="60" y="325" text-anchor="end" class="label" font-weight="bold">V₂' (C_(i+1))</text>
  <rect x="440" y="310" width="240" height="26" class="ci"/>
  <text x="560" y="327" text-anchor="middle" class="label">V₂' validates Y+1 (re-advertised, sticky core)</text>
  <line x1="680" y1="323" x2="780" y2="323" stroke="#2e8b57" stroke-width="2"/>
  <polygon points="775,318 785,323 775,328" class="ok"/>
  <text x="730" y="315" text-anchor="middle" class="label ok">→ N+3 ✓</text>

  <path d="M 680 310 Q 680 290 680 266" stroke="#6a4fb5" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
  <polygon points="675,272 680,266 685,272" fill="#6a4fb5"/>

  <text x="80"  y="402" class="small">t = 0</text>
  <text x="440" y="402" text-anchor="middle" class="small">+6 s (S+1 → S+2)</text>
  <text x="800" y="402" text-anchor="middle" class="small" font-weight="bold" fill="#c00">+12 s (N+3 starts)</text>

  <text x="450" y="430" text-anchor="middle" class="caption" font-weight="bold" fill="#2e8b57">All 3 cores of N+3 filled — no core lost. Naive freshness + core stickiness suffice.</text>
</svg>
