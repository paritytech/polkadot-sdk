<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 700" font-family="Inter, system-ui, sans-serif" font-size="14">
  <style>
    .lane-bg { fill: #f7f7f9; stroke: #d0d0d6; stroke-width: 1; }
    .lane-label { font-weight: 600; font-size: 13px; fill: #2a2a35; }
    .lane-sub { font-size: 11px; fill: #6a6a75; }
    .axis { stroke: #444; stroke-width: 1.5; fill: none; }
    .tick { stroke: #888; stroke-width: 1; }
    .tick-label { font-size: 11px; fill: #444; text-anchor: middle; }
    .ev-c1 { fill: #ee6b3a; stroke: #c14820; }
    .threshold-line { stroke: #d6342f; stroke-width: 2; stroke-dasharray: 6 4; }
    .threshold-label { font-size: 12px; font-weight: 600; fill: #d6342f; }
    .event-label { font-size: 11px; fill: #2a2a35; }
    .title { font-size: 18px; font-weight: 700; fill: #1a1a25; }
    .subtitle { font-size: 13px; fill: #4a4a55; }
    .footnote { font-size: 11px; fill: #6a6a75; font-style: italic; }
    .takeaway { fill: #fff7e6; stroke: #d6a800; stroke-width: 1.4; }
    .takeaway-text { font-size: 12px; fill: #2a2a35; }
    .bundle-c0 { fill: #cfe2fb; stroke: #1c5dc1; stroke-width: 1.4; }
    .bundle-c1 { fill: #ffd8c5; stroke: #c14820; stroke-width: 1.4; }
    .bundle-text { font-size: 12px; font-weight: 600; fill: #1a1a25; }
    .core-tag { fill: #1c5dc1; }
    .core-tag-text { font-size: 11px; font-weight: 700; fill: #fff; }
    .seg-list { font-size: 11px; fill: #2a2a35; }
    .seg-dedup { fill: #c0ecda; stroke: #007e62; stroke-width: 1; }
    .seg-fetch { fill: #ffd8c5; stroke: #c14820; stroke-width: 1; }
    .slot-boundary { stroke: #1a1a25; stroke-width: 2; }
    .slot-label { font-size: 12px; font-weight: 700; fill: #1a1a25; }
    .guide-line { stroke: #c14820; stroke-width: 0.8; stroke-dasharray: 2 3; opacity: 0.5; }
    .timeline-bg { fill: #ececf2; stroke: #444; stroke-width: 1; }
  </style>

  <!-- ===== TITLE ===== -->
  <text x="40" y="40" class="title">Slot Transition Across 3 Cores — Happy Path</text>
  <text x="40" y="62" class="subtitle">C₁ produces one bundle every 2 s, sending each to a different core. The freshness rule omits X+2 from the first segment; later cores naturally dedup it.</text>
  <text x="40" y="80" class="footnote">Configuration: Basti, 3 cores, 4 × 500 ms blocks per bundle, validation 2 s, freshness threshold ≈ 2.8 s. C₀ → C₁ slot transition aligned with relay-block boundary.</text>

  <!-- ===== TIMELINE (placed near top) ===== -->
  <!-- timeline 0 .. 7000 ms; 120 .. 1140 px; 1ms = 0.146 px; 1000ms = 146 px -->
  <rect x="120" y="100" width="1020" height="32" class="timeline-bg"/>
  <line x1="120" y1="116" x2="1140" y2="116" class="axis"/>
  <g>
    <line x1="120" y1="111" x2="120" y2="121" class="tick"/><text x="120" y="103" class="tick-label">t = 0</text>
    <line x1="266" y1="111" x2="266" y2="121" class="tick"/><text x="266" y="103" class="tick-label">+1 s</text>
    <line x1="412" y1="111" x2="412" y2="121" class="tick"/><text x="412" y="103" class="tick-label">+2 s</text>
    <line x1="558" y1="111" x2="558" y2="121" class="tick"/><text x="558" y="103" class="tick-label">+3 s</text>
    <line x1="704" y1="111" x2="704" y2="121" class="tick"/><text x="704" y="103" class="tick-label">+4 s</text>
    <line x1="850" y1="111" x2="850" y2="121" class="tick"/><text x="850" y="103" class="tick-label">+5 s</text>
    <line x1="996" y1="111" x2="996" y2="121" class="tick"/><text x="996" y="103" class="tick-label">+6 s</text>
    <line x1="1140" y1="111" x2="1140" y2="121" class="tick"/><text x="1140" y="103" class="tick-label">+7 s</text>
  </g>

  <!-- slot transition vertical line at t=0 -->
  <line x1="120" y1="100" x2="120" y2="540" class="slot-boundary"/>
  <text x="125" y="135" class="slot-label" font-size="11">slot transition</text>

  <!-- threshold at +2.8s: x = 120 + 2800*0.146 = 528.8 -->
  <line x1="529" y1="100" x2="529" y2="540" class="threshold-line"/>
  <text x="537" y="135" class="threshold-label" font-size="11">freshness ≈ 2.8 s</text>

  <!-- C0 tail markers on the timeline -->
  <rect x="92" y="138" width="56" height="18" rx="3" class="bundle-c0"/>
  <text x="120" y="151" text-anchor="middle" class="bundle-text" font-size="10">X+2</text>
  <text x="155" y="151" class="seg-list" font-size="10">← C₀'s last bundle (advertised at t=0, becomes known to V₂ at threshold)</text>

  <!-- ===== ADVERTISEMENT 1: t=+2s, core 1 ===== -->
  <g>
    <line x1="412" y1="180" x2="412" y2="540" class="guide-line"/>

    <!-- bundle box -->
    <rect x="362" y="180" width="100" height="46" rx="6" class="bundle-c1"/>
    <text x="412" y="200" text-anchor="middle" class="bundle-text">Y</text>
    <text x="412" y="218" text-anchor="middle" class="seg-list" font-size="10">C₁'s 1st bundle</text>

    <!-- core tag -->
    <rect x="468" y="190" width="72" height="20" rx="3" class="core-tag"/>
    <text x="504" y="204" text-anchor="middle" class="core-tag-text">→ CORE 1</text>

    <text x="412" y="248" text-anchor="middle" class="event-label" font-weight="600">at +2 s</text>

    <!-- segment composition -->
    <text x="412" y="278" text-anchor="middle" class="seg-list" font-weight="600">segment to V₂:</text>
    <rect x="378" y="288" width="36" height="20" class="seg-dedup"/>
    <text x="396" y="302" text-anchor="middle" class="event-label" font-size="10">X+1 ✓</text>
    <rect x="418" y="288" width="56" height="20" class="seg-fetch"/>
    <text x="446" y="302" text-anchor="middle" class="event-label" font-size="10">Y ← fetch</text>
    <text x="412" y="328" text-anchor="middle" class="seg-list" font-size="10" fill="#6a6a75">(X+2 too fresh — omitted)</text>
  </g>

  <!-- ===== ADVERTISEMENT 2: t=+4s, core 2 ===== -->
  <g>
    <line x1="704" y1="180" x2="704" y2="540" class="guide-line"/>

    <rect x="654" y="180" width="100" height="46" rx="6" class="bundle-c1"/>
    <text x="704" y="200" text-anchor="middle" class="bundle-text">Y+1</text>
    <text x="704" y="218" text-anchor="middle" class="seg-list" font-size="10">C₁'s 2nd bundle</text>

    <rect x="760" y="190" width="72" height="20" rx="3" class="core-tag"/>
    <text x="796" y="204" text-anchor="middle" class="core-tag-text">→ CORE 2</text>

    <text x="704" y="248" text-anchor="middle" class="event-label" font-weight="600">at +4 s</text>

    <text x="704" y="278" text-anchor="middle" class="seg-list" font-weight="600">segment to V₂:</text>
    <rect x="666" y="288" width="36" height="20" class="seg-dedup"/>
    <text x="684" y="302" text-anchor="middle" class="event-label" font-size="10">X+2 ✓</text>
    <rect x="706" y="288" width="80" height="20" class="seg-fetch"/>
    <text x="746" y="302" text-anchor="middle" class="event-label" font-size="10">Y+1 ← fetch</text>
    <text x="704" y="328" text-anchor="middle" class="seg-list" font-size="10" fill="#6a6a75">(X+1, Y too fresh — omitted)</text>
  </g>

  <!-- ===== ADVERTISEMENT 3: t=+6s, core 3 ===== -->
  <g>
    <line x1="996" y1="180" x2="996" y2="540" class="guide-line"/>

    <rect x="946" y="180" width="100" height="46" rx="6" class="bundle-c1"/>
    <text x="996" y="200" text-anchor="middle" class="bundle-text">Y+2</text>
    <text x="996" y="218" text-anchor="middle" class="seg-list" font-size="10">C₁'s 3rd bundle</text>

    <rect x="1052" y="190" width="72" height="20" rx="3" class="core-tag"/>
    <text x="1088" y="204" text-anchor="middle" class="core-tag-text">→ CORE 3</text>

    <text x="996" y="248" text-anchor="middle" class="event-label" font-weight="600">at +6 s</text>

    <text x="996" y="278" text-anchor="middle" class="seg-list" font-weight="600">segment to V₂:</text>
    <rect x="938" y="288" width="36" height="20" class="seg-dedup"/>
    <text x="956" y="302" text-anchor="middle" class="event-label" font-size="10">X+1 ✓</text>
    <rect x="978" y="288" width="36" height="20" class="seg-dedup"/>
    <text x="996" y="302" text-anchor="middle" class="event-label" font-size="10">Y ✓</text>
    <rect x="1018" y="288" width="80" height="20" class="seg-fetch"/>
    <text x="1058" y="302" text-anchor="middle" class="event-label" font-size="10">Y+2 ← fetch</text>
    <text x="996" y="328" text-anchor="middle" class="seg-list" font-size="10" fill="#6a6a75">(X+2, Y+1 too fresh — omitted)</text>
  </g>

  <!-- ===== Net result row ===== -->
  <rect x="40" y="365" width="1120" height="50" class="lane-bg"/>
  <text x="50" y="384" class="lane-label">Net result</text>
  <text x="50" y="403" class="seg-list">Each core fetches exactly one new bundle: <tspan font-weight="700" fill="#c14820">core 1 → Y</tspan>, <tspan font-weight="700" fill="#c14820">core 2 → Y+1</tspan>, <tspan font-weight="700" fill="#c14820">core 3 → Y+2</tspan>. No core wastes work re-fetching what V₂ already has.</text>

  <!-- ===== KEY ===== -->
  <rect x="40" y="425" width="1120" height="50" class="lane-bg"/>
  <text x="50" y="443" class="lane-label">Key</text>
  <g transform="translate(50, 452)">
    <rect x="0" y="0" width="36" height="20" class="seg-dedup"/>
    <text x="44" y="14" class="event-label">already known to V₂ (dedup hit)</text>

    <rect x="270" y="0" width="36" height="20" class="seg-fetch"/>
    <text x="314" y="14" class="event-label">first non-dedup-hit fingerprint — fetched</text>

    <rect x="620" y="0" width="36" height="20" class="bundle-c0"/>
    <text x="664" y="14" class="event-label">C₀'s tail bundle</text>

    <rect x="800" y="0" width="36" height="20" class="bundle-c1"/>
    <text x="844" y="14" class="event-label">C₁'s new bundle</text>
  </g>

  <!-- ===== TAKEAWAY ===== -->
  <rect x="40" y="490" width="1240" height="65" rx="6" class="takeaway"/>
  <text x="50" y="510" class="takeaway-text" font-weight="700">Takeaway:</text>
  <text x="120" y="510" class="takeaway-text">Bundles are produced and advertised sequentially every 2 s, each to a different core. The freshness rule omits X+2 from the +2 s segment</text>
  <text x="50" y="528" class="takeaway-text">(too fresh — V₂ wouldn't know it yet); by +4 s and +6 s, V₂ already knows X+2, so it dedups. Each core fetches exactly one new bundle —</text>
  <text x="50" y="546" class="takeaway-text" font-weight="600">the ~2.8 s freshness threshold fits within the 2 s bundle cadence on the very next advertisement, so no core is wasted.</text>

</svg>
