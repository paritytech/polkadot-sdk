<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 460" font-family="sans-serif" font-size="14">
  <style>
    .axis { stroke: #333; stroke-width: 1.5; }
    .grid { stroke: #bbb; stroke-dasharray: 4,3; }
    .ok { fill: #2e8b57; }
    .bad { fill: #c00; }
    .idle { fill: #d4a017; }
    .ci { fill: #cfe4ff; stroke: #3a7bd5; }
    .cinext { fill: #efe6ff; stroke: #6a4fb5; }
    .seal { fill: #dfd; stroke: #2e8b57; }
    .seal-text { fill: #2e8b57; font-weight: bold; }
    .title { font-weight: bold; font-size: 18px; fill: #2e8b57; }
    .caption { font-size: 13px; fill: #333; }
    .label { font-size: 12px; }
    .small { font-size: 10px; fill: #666; }
  </style>

  <!--
    Same scale: 1 s = 48.33 px, slot = 290 px.
    Plot area: 80..950 = 3 slots × 290 = 870 px.
    Slot boundaries: 80 (t=0), 370 (t=6), 660 (t=12), 950 (t=18).
    Times we plot:
      slot S+1 (80..370):
        Y advert      t=0..2  → 80..177
        V1 backs Y    t=2..4  → 177..274
        Y+1 advert    t=2..4  → 177..274
        Y+2 advert    t=4..6  → 274..370
      slot S+2 (370..660):
        C_{i+1} resubmits Y+1   t=6..8  → 370..467
        V_1' backs Y+1          t=8..10 → 467..564
        V_3 backs Y+2           t=10..12 → 564..660
      slot S+3 (660..950): N+3 seals at end (950)
  -->

  <!-- title -->
  <text x="525" y="26" text-anchor="middle" class="title">With floor: C_(i+1)'s offset 1 overlaps C_i's offset 2 — gap filled</text>

  <!-- axes + slot boundaries -->
  <line x1="80" y1="380" x2="950" y2="380" class="axis"/>
  <line x1="80"  y1="60" x2="80"  y2="380" class="axis"/>
  <line x1="370" y1="60" x2="370" y2="380" class="grid"/>
  <line x1="660" y1="60" x2="660" y2="380" class="grid"/>
  <line x1="950" y1="60" x2="950" y2="380" class="axis"/>

  <text x="225" y="48" text-anchor="middle" class="label" font-weight="bold">slot S+1 (C_i: off 1→N+2, off 2→N+3)</text>
  <text x="515" y="48" text-anchor="middle" class="label" font-weight="bold">slot S+2 (C_(i+1): off 1→N+3)</text>
  <text x="805" y="48" text-anchor="middle" class="label" font-weight="bold">slot S+3</text>

  <!-- N+2 seals end of S+2 (660), N+3 seals end of S+3 (950) -->
  <rect x="640" y="68" width="40" height="22" class="seal"/>
  <text x="660" y="84" text-anchor="middle" class="seal-text" font-size="11">N+2 seals</text>
  <rect x="930" y="68" width="40" height="22" class="seal"/>
  <text x="950" y="84" text-anchor="middle" class="seal-text" font-size="11">N+3 seals</text>

  <!-- V_1: Y advert t=0..2, V_1 backs Y t=2..4, arrow to N+2 at 660 -->
  <text x="60" y="135" text-anchor="end" class="label" font-weight="bold">V₁</text>
  <rect x="80"  y="120" width="97" height="26" class="ci"/>
  <text x="128" y="137" text-anchor="middle" class="label">Y advert</text>
  <rect x="177" y="120" width="97" height="26" class="ci"/>
  <text x="225" y="137" text-anchor="middle" class="label">V₁ backs Y</text>
  <line x1="274" y1="133" x2="640" y2="133" stroke="#2e8b57" stroke-width="2"/>
  <polygon points="635,128 645,133 635,138" class="ok"/>
  <text x="450" y="125" text-anchor="middle" class="label ok">Y → N+2 ✓ (offset 1)</text>

  <!-- V_2: Y+1 advert t=2..4, V_2 fails -->
  <text x="60" y="195" text-anchor="end" class="label" font-weight="bold">V₂</text>
  <rect x="177" y="180" width="97" height="26" fill="#ffe2e2" stroke="#c00"/>
  <text x="225" y="197" text-anchor="middle" class="label">Y+1 advert</text>
  <text x="282" y="197" class="label bad" font-weight="bold">✗ V₂ fails — Y+1 lost</text>

  <!-- V_3: Y+2 advert t=4..6, idle from t=6 until Y+1 resubmit done at t=10, V_3 backs Y+2 t=10..12 -->
  <text x="60" y="255" text-anchor="end" class="label" font-weight="bold">V₃</text>
  <rect x="274" y="240" width="96" height="26" fill="#fff2cc" stroke="#d4a017"/>
  <text x="322" y="257" text-anchor="middle" class="label">Y+2 advert</text>
  <text x="380" y="257" class="label idle">V₃ idles (parent missing)</text>
  <rect x="564" y="240" width="96" height="26" class="ci"/>
  <text x="612" y="257" text-anchor="middle" class="label">V₃ backs Y+2</text>
  <line x1="660" y1="253" x2="930" y2="253" stroke="#2e8b57" stroke-width="2"/>
  <polygon points="925,248 935,253 925,258" class="ok"/>
  <text x="795" y="245" text-anchor="middle" class="label ok">Y+2 → N+3 ✓</text>

  <!-- C_{i+1}: resubmits Y+1 t=6..8 (370..467), V_1' backs Y+1 t=8..10 (467..564) -->
  <text x="60" y="325" text-anchor="end" class="label" font-weight="bold">C_(i+1)</text>
  <rect x="370" y="310" width="97" height="26" class="cinext"/>
  <text x="418" y="327" text-anchor="middle" class="label">resubmit Y+1</text>
  <rect x="467" y="310" width="97" height="26" class="ci"/>
  <text x="515" y="327" text-anchor="middle" class="label">V₁' backs Y+1</text>
  <line x1="564" y1="323" x2="930" y2="323" stroke="#2e8b57" stroke-width="2"/>
  <polygon points="925,318 935,323 925,328" class="ok"/>
  <text x="747" y="315" text-anchor="middle" class="label ok">Y+1 → N+3 ✓ (overlap with C_i offset 2)</text>

  <!-- arrow Y+1 backed → V_3 unblock -->
  <path d="M 564 310 Q 564 285 564 266" stroke="#6a4fb5" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
  <polygon points="559,272 564,266 569,272" fill="#6a4fb5"/>
  <text x="370" y="355" class="small" fill="#6a4fb5">Y+1 backed → V₃'s can_second succeeds → V₃ backs Y+2</text>

  <!-- bottom labels -->
  <text x="80"  y="405" class="small">t = 0</text>
  <text x="370" y="405" text-anchor="middle" class="small">slot S+1 → S+2</text>
  <text x="660" y="405" text-anchor="middle" class="small">slot S+2 → S+3</text>
  <text x="950" y="405" text-anchor="end" class="small">slot S+3 end</text>

  <text x="525" y="435" text-anchor="middle" class="caption" font-weight="bold" fill="#2e8b57">N+3 receives 3 candidates (resubmitted Y+1, Y+2, V₃'s late backing). Naive freshness suffices.</text>
</svg>
