<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="sans-serif" font-size="14">
  <!-- slot ticks -->
  <line x1="40"  y1="50"  x2="40"  y2="290" stroke="#333"/>
  <line x1="240" y1="50"  x2="240" y2="290" stroke="#bbb" stroke-dasharray="4,4"/>
  <line x1="440" y1="50"  x2="440" y2="290" stroke="#c00" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="640" y1="50"  x2="640" y2="290" stroke="#bbb" stroke-dasharray="4,4"/>
  <line x1="840" y1="50"  x2="840" y2="290" stroke="#333"/>
  <text x="140" y="40" text-anchor="middle" fill="#333">slot S</text>
  <text x="340" y="40" text-anchor="middle" fill="#333">slot S+1 (3 builds)</text>
  <text x="540" y="40" text-anchor="middle" fill="#333">slot S+2</text>
  <text x="740" y="40" text-anchor="middle" fill="#333">slot S+3</text>
  <text x="440" y="308" text-anchor="middle" fill="#c00" font-size="13">N+1 seal (12 s)</text>

  <!-- p1 row -->
  <rect x="240" y="78"  width="66"  height="20" fill="#ffd9e8" stroke="#e6007a"/>
  <text x="273" y="92" text-anchor="middle" font-size="12">p1 build</text>
  <rect x="306" y="78"  width="134" height="20" fill="#cfe4ff" stroke="#3a7bd5"/>
  <text x="710" y="92" text-anchor="start" fill="#1f5fa8" font-size="13">p1 tail ≈ 4 s ✓ at budget</text>

  <!-- p2 row -->
  <rect x="306" y="128" width="66"  height="20" fill="#ffd9e8" stroke="#e6007a"/>
  <text x="339" y="142" text-anchor="middle" font-size="12">p2 build</text>
  <rect x="372" y="128" width="68"  height="20" fill="#fff2cc" stroke="#d4a017"/>
  <text x="710" y="142" text-anchor="start" fill="#8a6500" font-size="13">p2 tail ≈ 2 s — half</text>

  <!-- p3 row -->
  <rect x="372" y="178" width="66"  height="20" fill="#ffd9e8" stroke="#e6007a"/>
  <text x="405" y="192" text-anchor="middle" font-size="12">p3 build</text>
  <rect x="438" y="178" width="4"   height="20" fill="#ffcccc" stroke="#c00"/>
  <text x="710" y="192" text-anchor="start" fill="#c00" font-size="13">p3 tail ≈ 0 s — slips to N+2</text>

  <!-- legend -->
  <line x1="40" y1="245" x2="172" y2="245" stroke="#2a7" stroke-width="3"/>
  <text x="106" y="263" text-anchor="middle" fill="#2a7" font-size="13">designed tail = 4 s</text>
</svg>
