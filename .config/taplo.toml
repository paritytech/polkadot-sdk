# all options https://taplo.tamasfe.dev/configuration/formatter-options.html

# ignore upstream dirs we don't maintain + zombienet custom toml
exclude = [
	"bridges/**",
	"cumulus/**",
	"polkadot/**",
	"substrate/client/transaction-pool/tests/zombienet/**",
	"substrate/zombienet/**",
	"target/**",
]

# global rules
[formatting]
reorder_arrays = true
inline_table_expand = false
array_auto_expand = true
array_auto_collapse = false
indent_string = "	"         # tab

# don't re-order order-dependent deb package metadata
[[rule]]
include = ["polkadot/Cargo.toml"]
keys = ["package.metadata.deb"]

[rule.formatting]
reorder_arrays = false

# don't re-order order-dependent rustflags
[[rule]]
include = [".cargo/config.toml"]
keys = ["build"]

[rule.formatting]
reorder_arrays = false

[[rule]]
include = ["Cargo.toml"]
keys = ["workspace.dependencies"]

[rule.formatting]
reorder_keys = true

[[rule]]
include = ["**/Cargo.toml"]
keys = ["build-dependencies", "dependencies", "dev-dependencies"]

[rule.formatting]
reorder_keys = true
